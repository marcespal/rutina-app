/** Aplicar la elección de ejercicio según de dónde se vino. */
function elegir(id) {
  const p = ui.params, e = L.ejercicioPorId(estado, id);
  if (!e) return;
  if (p.para === "rutina") {
    if (ui.rutina && !ui.rutina.ejercicios.some((x) => x.ejercicio_id === id)) ui.rutina.ejercicios.push({ ejercicio_id: id, series: e.series });
    ir("rutina", {}, true); return;
  }
  const s = L.sesionPorId(estado, p.id) || L.sesionEnCurso(estado);
  if (!s) { ir("inicio"); return; }
  if (p.para === "cambiar") {
    const b = s.ejercicios[p.i];
    if (b && !b.filas.some((f) => f.hecha)) {
      const ya = s.ejercicios.findIndex((x) => x.ejercicio_id === id);
      cambiar(() => {
        if (ya >= 0 && ya !== p.i) { s.ejercicios.splice(p.i, 1); ui.abierto[s.id] = ya > p.i ? ya - 1 : ya; }
        else s.ejercicios[p.i] = L.bloqueSesion(estado, refDe(s), id, b.series_plan);
      }, true);
    }
  } else {
    const ya = s.ejercicios.findIndex((x) => x.ejercicio_id === id);
    if (ya >= 0) ui.abierto[s.id] = ya;
    else { cambiar(() => s.ejercicios.push(L.bloqueSesion(estado, refDe(s), id, e.series)), true); ui.abierto[s.id] = s.ejercicios.length - 1; }
  }
  // Volver a la sesión sin dejar «elegir» en el historial
  ir("sesion", { id: s.id }, true);
}

/* Cambios de campos (sin repintar mientras se escribe) */
const CAMBIOS = {
  valor(el) {
    const x = filaDe(el); if (!x) return;
    const campo = el.dataset.campo;
    const n = campo === "peso" ? L.limitarPeso(el.value) : L.limitarReps(el.value);
    if (n === null) { toast("Número no válido: usa por ejemplo 62,5"); el.value = campo === "peso" ? (x.f.peso == null ? "" : L.kg(x.f.peso)) : (x.f.reps == null ? "" : x.f.reps); return; }
    cambiar(() => { x.f[campo] = n; if (!x.f.hecha) x.f.tocada = true; }, true);
    el.value = campo === "peso" ? L.kg(n) : String(n);
  },
  async importar(el) {
    const f = el.files && el.files[0]; el.value = "";
    if (!f) return;
    const r = await P.importar(f);
    if (r.ok) { if (estado && estado.perfil) cambiar((d) => { d.perfil.bienvenida_hecha = true; }, true); capas.filter((c) => !c.resolver).forEach((c) => cerrarCapa(c.id)); Object.keys(urlsFoto).forEach(olvidarUrlFoto); toast("Respaldo importado" + (r.fotos ? " con " + r.fotos + " fotos" : "")); ir("inicio", {}, true); }
  },
  ejGrafico(el) { ui.ejGrafico = el.value; render(); },
  async fotoFicha(el) {
    const f = el.files && el.files[0]; el.value = ""; if (!f) return;
    const id = el.dataset.id;
    try { const b = await comprimirFoto(f); await P.guardarFoto(id, b); olvidarUrlFoto(id); cambiar((d) => { L.ejercicioPorId(d, id).tiene_foto = true; }); toast("Foto guardada (" + Math.round(b.size / 1024) + " KB)"); }
    catch (e) { aviso("No se guardó la foto", esc(e.message)); }
  },
  async fotoForm(el) {
    const f = el.files && el.files[0]; el.value = ""; if (!f) return;
    try {
      ui.fotoPendiente = await comprimirFoto(f); ui.quitarFoto = false;
      const img = $("#prev-foto"); if (img) { img.removeAttribute("data-foto"); img.src = URL.createObjectURL(ui.fotoPendiente); img.classList.remove("oculto"); }
      toast("Foto lista (" + Math.round(ui.fotoPendiente.size / 1024) + " KB); se guarda con el ejercicio");
    } catch (e) { aviso("No se pudo usar la foto", esc(e.message)); }
  }
};
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (!f) return;
  ev.preventDefault();
  try { const r = f(el, ev); if (r && r.catch) r.catch((e) => { console.error(e); aviso("Algo falló", esc(e.message)); }); }
  catch (e) { console.error(e); aviso("Algo falló", esc(e.message)); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-c]");
  if (el && CAMBIOS[el.dataset.c]) { try { const r = CAMBIOS[el.dataset.c](el, ev); if (r && r.catch) r.catch((e) => console.error(e)); } catch (e) { console.error(e); } }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.i === "buscar") {
    ui.buscar = el.value;
    const cont = $("#lista-ej");
    if (cont) cont.innerHTML = ui.vista === "elegir" ? listaEjerciciosHtml("elegido") : listaEjerciciosHtml("ir", ' data-v="ficha"');
    cargarFotos();
  } else if (el.dataset && el.dataset.i === "rutinaNombre" && ui.rutina) ui.rutina.nombre = el.value;
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); const b = A[ev.target.dataset.enter]; if (b) b(ev.target); return; } if (ev.key === "Enter" && ev.target.matches && ev.target.matches("input[data-c=valor]")) { ev.preventDefault(); ev.target.blur(); } });

/* ── reloj de la sesión: hora de término guardada, no contador ── */
setInterval(() => {
  if (ui.vista !== "sesion" || !estado) return;
  const s = sesionActual(); if (!s) return;
  const d = $("#ses-dur"); if (d) d.textContent = durTexto(s);
  if (s.terminada_en == null && s.descanso) {
    const resta = Math.max(0, Math.ceil((s.descanso.fin - Date.now()) / 1000));
    const t = $("#desc-t");
    if (resta > 0 && t) { t.textContent = reloj(resta); const b = $("#desc-barra"); if (b) b.style.width = Math.min(100, Math.round(resta / s.descanso.total * 100)) + "%"; }
    else if (resta === 0 && t) {
      if (ui.descansoAvisado !== s.descanso.fin) {
        ui.descansoAvisado = s.descanso.fin;
        if (document.visibilityState === "visible" && navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
      }
      if (!document.querySelector("input:focus")) render();
    }
  }
}, 500);

/* ═══ APP INSTALABLE (solo servida por https/localhost: GitHub Pages) ═══
   Abierta desde Archivos o en una demo, PWA.servida es false y nada de esto corre.
   El service worker (sw.js) guarda la app para abrir sin señal; nunca toca los datos.
   Una versión nueva espera hasta que el usuario toca «Actualizar»: antes de recargar
   se guarda todo, y una sesión en curso se retoma sola al volver. */
const VERSION_APP = "bc8b1dda5c"; /*VERSION-APP*/
/* iPhone/iPad: todos sus navegadores (Chrome incluido) usan el motor de Safari. Sin archivo
   conectado (no existe la API), sin botón propio de instalar y, si se quita el ícono, se borran los
   datos. iPadOS se presenta como Mac: se reconoce por la pantalla táctil. */
const ES_IOS = (() => { try { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); } catch (e) { return false; } })();
/* Nombre del botón de respaldo que de verdad se ve: «Guardar respaldo» (menú Compartir) o «Exportar respaldo». */
const BOTON_RESPALDO = () => (typeof navigator !== "undefined" && navigator.share ? "Guardar respaldo" : "Exportar respaldo");
const PWA = {
  servida: /^https?:$/.test(location.protocol) && !DEMO, ios: ES_IOS,
  instalada: false, aviso: null, nueva: null, sw: "sin registrar", recargando: false
};
/* Repintar sin pisar lo que se está escribiendo ni antes de cargar los datos. */
function repintarPwa() { if (estado && !document.querySelector("input:focus, textarea:focus")) render(); }
function verInstalada() {
  try { PWA.instalada = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches || navigator.standalone === true; }
  catch (e) { PWA.instalada = false; }
}
function avisosPwa() {
  if (!PWA.servida) return "";
  let h = "";
  if (PWA.nueva) h += '<div class="nota suave"><div class="cuerpo"><b>Hay una versión nueva de Rutina</b><span class="pequeno">Actualizar no toca tus registros.</span><div class="acciones"><button class="btn prim" data-a="pwaActualizar">Actualizar</button></div></div></div>';
  if (!PWA.instalada && PWA.ios && !ui.ocultarInstalar) h += '<div class="nota suave"><div class="cuerpo"><b>Instala Rutina en tu iPhone</b><span class="pequeno">Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba) y luego «Agregar a pantalla de inicio». Instalada abre sin internet y el iPhone no borra sus datos por dejar de usarla. Instálala antes de empezar: lo que anotes en el navegador no pasa a la app instalada.</span></div><button class="icono" data-a="ocultarInstalar" aria-label="Ocultar">' + ic("x", 18) + "</button></div>";
  if (!PWA.instalada && PWA.aviso && !ui.ocultarInstalar) h += '<div class="nota suave"><div class="cuerpo"><b>Instala Rutina</b><span class="pequeno">Queda con su ícono, abre sin internet y Chrome cuida mejor tus datos.</span><div class="acciones"><button class="btn prim" data-a="pwaInstalar">Instalar</button></div></div><button class="icono" data-a="ocultarInstalar" aria-label="Ocultar">' + ic("x", 18) + "</button></div>";
  return h;
}
function iniciarPwa() {
  verInstalada();
  if (!PWA.servida) return;
  try { matchMedia("(display-mode: standalone)").addEventListener("change", () => { verInstalada(); repintarPwa(); }); } catch (e) {}
  window.addEventListener("beforeinstallprompt", (ev) => { ev.preventDefault(); PWA.aviso = ev; repintarPwa(); });
  if (!("serviceWorker" in navigator)) { PWA.sw = "no disponible en este navegador"; return; }
  window.addEventListener("appinstalled", () => { PWA.aviso = null; PWA.instalada = true; toast("Rutina quedó instalada"); pedirPersistencia(); });
  const marcarNueva = (w) => { if (w && navigator.serviceWorker.controller) { PWA.nueva = w; repintarPwa(); } };
  navigator.serviceWorker.register("sw.js").then((reg) => {
    PWA.sw = "registrado";
    marcarNueva(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      if (w) w.addEventListener("statechange", () => { if (w.state === "installed") marcarNueva(w); });
    });
    /* Al volver a la app (queda abierta días en el teléfono) se busca versión nueva. */
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch((e) => { PWA.sw = "falló: " + ((e && e.message) || e); });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!PWA.recargando) return;          // solo recarga si el usuario pidió actualizar
    location.reload();
  });
}
Object.assign(A, {
  async pwaInstalar() {
    const ev = PWA.aviso;
    if (!ev) { toast("Usa el menú ⋮ de Chrome → Instalar app"); return; }
    PWA.aviso = null;
    try { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome !== "accepted") toast("Puedes instalarla después desde Ajustes"); } catch (e) {}
    render();
  },
  ocultarInstalar() { ui.ocultarInstalar = true; render(); },
  async pwaActualizar() {
    if (!PWA.nueva) return;
    try { await P.guardarAhora(); } catch (e) { /* el diario en localStorage cubre lo último */ }
    PWA.recargando = true;
    PWA.nueva.postMessage("actualizar");
    setTimeout(() => location.reload(), 4000);   // por si controllerchange no llega
  }
});

/* ═══ ARRANQUE ═══ */
async function pedirPersistencia() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      let ok = await navigator.storage.persisted();
      if (!ok && navigator.storage.persist) ok = await navigator.storage.persist();
      ui.persistente = !!ok;
    } else ui.persistente = null;
  } catch (e) { ui.persistente = null; }
  render();
}
function bloqueo() {
  document.body.insertAdjacentHTML("beforeend", '<div class="bloqueo" id="bloqueo"><h1 style="margin:0;font-size:26px">Rutina ya está abierta en otra pestaña</h1><p class="tenue" style="margin:0">Para que dos pestañas no se pisen los datos, solo una puede usarla a la vez.</p>' +
    '<button class="btn prim grande" data-a="bloqueoReintentar">Ya la cerré, reintentar</button><button class="btn ancho" data-a="bloqueoRobar">Usar aquí de todos modos</button></div>');
}
A.compartirKilos = compartirKilos;
A.compartirMapa = compartirMapa;
A.figura = accionFigura;
A.bloqueoReintentar = async () => { const b = $("#bloqueo"); if (b) b.remove(); arrancar(false); };
A.bloqueoRobar = async () => {
  if (!await confirmar("Usar aquí", "La otra pestaña quedará en solo lectura y esta toma el control con los datos guardados.", "Usar aquí")) return;
  const b = $("#bloqueo"); if (b) b.remove(); arrancar(true);
};
async function arrancar(robar) {
  let r;
  try { r = await P.iniciar({ robar: robar }); }
  catch (e) { console.error(e); r = { ok: true, estado: "sin-almacenamiento" }; }
  if (r.estado === "otra-pestana") { bloqueo(); return; }
  if (r.recuperado) setTimeout(() => toast("Se recuperó lo último que anotaste antes de cerrar"), 400);
  if (r.estado === "sin-almacenamiento") estado = L.documentoNuevo();
  else if (r.estado === "nuevo") { if (!estado) { estado = L.documentoNuevo(); await P.guardarLocal(); } }   // si el archivo recordado ya cargó datos, no se pisan
  else if (r.estado === "ilegible") { estado = null; ui.vista = "rescate"; }
  /* Bienvenida solo con un estado leído BIEN y vacío, sin archivo conectado ni recordado:
     nunca por una lectura fallida (ilegible va a Rescate). */
  const darBienvenida = !!estado && r.estado !== "sin-almacenamiento" && !estado.perfil.bienvenida_hecha && L.estaVacio(estado) && !P.archivo() && !P.pendiente();
  ui.ultimoRespaldo = await P.ultimoRespaldoExterno();
  ui.ultimoPendiente = !!(P.pendiente() && !P.archivo());
  const enCurso = estado && L.sesionEnCurso(estado);
  try { history.replaceState({ vista: "inicio", params: {} }, ""); } catch (e) {}
  if (darBienvenida) { ui.paso = 1; ir("bienvenida", {}, true); }
  else if (enCurso && ui.vista !== "rescate") ir("sesion", { id: enCurso.id }); else render(true);
  await pedirPersistencia();
}
/* Repintar Ajustes trae los respaldos internos (asíncrono). */
const renderBase = render;
render = function (nuevaVista) { renderBase(nuevaVista); if (ui.vista === "ajustes") pintarRespaldos(); };
window.addEventListener("error", (ev) => { console.error(ev.error || ev.message); });
window.Rutina = { L: L, P: P, ui: ui, PWA: PWA, estado: () => estado, render: () => render(true) };   // para inspección y pruebas
iniciarPwa();
arrancar(false);
})();

</script>
