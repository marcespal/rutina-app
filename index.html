<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<title>Rutina</title>
<script>
/* Solo servida por http(s) (GitHub Pages, localhost): manifest e íconos para instalarla.
   Abierta desde Archivos (content://, file://) o dentro de una demo (about:srcdoc) no se agrega nada. */
if (/^https?:$/.test(location.protocol)) {
  for (const [rel, href, extra] of [["manifest", "manifest.webmanifest"], ["icon", "icono.svg", "image/svg+xml"], ["apple-touch-icon", "icono-apple.png"]]) {
    const l = document.createElement("link"); l.rel = rel; l.href = href; if (extra) l.type = extra; document.head.appendChild(l);
  }
}
</script>
<!--
  Rutina · registro de gimnasio en un solo archivo HTML.
  Sin dependencias, sin internet. Todo vive en este teléfono (IndexedDB); el
  respaldo .json lo guarda el usuario («Guardar respaldo»). Copia local de la sección «Gym».
-->
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --track:#ECEBE7; --ink:#1B1C1E; --muted:#5C6066; --ghost:#8A8E94;
  --line:#E2E2DE; --dash:#B9BBB6; --accent:#2E5E74; --on-accent:#FFFFFF; --soft:#E3ECF0; --cal-bg:#F7F7F5;
  --warn-ink:#7A4F0E; --warn-bg:#F4EEE2; --ok-ink:#2F6B3F; --ok-bg:#E4F0E6; --danger:#A33A2A; --danger-bg:#F6E7E4;
  --l0:#F1F1EE; --l1:#D9E6EC; --l2:#9DBDCB; --l3:#2E5E74; --l3-ink:#FFFFFF;
  --band:#E3ECF0; --band-line:#B9CFD9; --bajo:#9DBDCB; --sobre:#7A4F0E;
  --sombra:0 1px 2px rgba(0,0,0,.12); --velo:rgba(0,0,0,.38);
  --mapa-piel:#E3E8EB; --mapa-borde:#C3CCD2; --mapa-base:#AEB9C0; --mapa-pelo:#8F9CA4; --mapa-n0:#A9CADA; --mapa-n1:#4F8AA6; --mapa-n2:#1F4A5E;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111213; --surface:#1A1B1D; --track:#24262A; --ink:#ECECEA; --muted:#A2A6AB; --ghost:#71767C;
    --line:#2C2E31; --dash:#4A4D52; --accent:#8FBACD; --on-accent:#0F1A20; --soft:#1F2C33; --cal-bg:#16171A;
    --warn-ink:#E3BC7A; --warn-bg:#2B2419; --ok-ink:#8CC79A; --ok-bg:#1D2A20; --danger:#E89A8C; --danger-bg:#2E1D1A;
    --l0:#1F2023; --l1:#1F2C33; --l2:#35596A; --l3:#8FBACD; --l3-ink:#0F1A20;
    --band:#24323A; --band-line:#3D5561; --bajo:#4C6E7E; --sobre:#E3BC7A;
    --sombra:none; --velo:rgba(0,0,0,.6);
    --mapa-piel:#3A4A53; --mapa-borde:#556873; --mapa-base:#24343D; --mapa-pelo:#18242B; --mapa-n0:#F6C28B; --mapa-n1:#F08A4B; --mapa-n2:#E4572E;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}
.tenue{color:var(--muted)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.vista{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;
  overscroll-behavior:contain}
.vista>*{flex-shrink:0}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cab .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cab h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.cab .fecha{font-size:13px;color:var(--muted)}
h2{margin:0;font-size:17px;font-weight:600}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.fila{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.entre{justify-content:space-between}
.pequeno{font-size:13px}
.mini{font-size:12px}

/* botones */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.grande{height:56px;font-size:18px;border-radius:14px;width:100%}
.btn.ancho{width:100%}
.btn.texto{border:0;background:transparent;color:var(--accent);padding:0 8px}
.btn.peligro{color:var(--danger);border-color:var(--line)}
.btn.peligro.lleno{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.punteado{border:1px dashed var(--dash);background:transparent;font-weight:500}
.icono{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:0 0 auto;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips.envolver{flex-wrap:wrap;overflow:visible}
.chips.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}
.chips.dias .chip{padding:0;min-width:0}

/* píldora de guardado */
.pildora{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);flex:0 0 auto;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pildora .punto{width:8px;height:8px;border-radius:4px;background:currentColor;flex:0 0 auto}
.pildora.ok{color:var(--ok-ink);background:var(--ok-bg);border-color:transparent}
.pildora.aviso{color:var(--warn-ink);background:var(--warn-bg);border-color:transparent}
.pildora.local{color:var(--muted)}
.pildora.boton{min-height:44px;max-width:48vw;white-space:normal;text-align:left;line-height:1.15;padding:4px 12px;border-radius:16px}
.pildora .lineas{display:flex;flex-direction:column;min-width:0}
.pildora .l2{font-size:12px;font-weight:500}
.pildora.compacta{min-height:44px;border-radius:22px;padding:0 10px;font-size:12px;max-width:100%}
.ses-cab>.col{flex:1 1 auto}

/* avisos en línea */
.nota{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);align-items:flex-start}
.nota .cuerpo{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.nota b{font-weight:600}
.nota.suave{background:var(--soft);color:var(--ink)}
.nota.peligro{background:var(--danger-bg);color:var(--danger)}
.nota .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nota .btn{min-height:44px}

/* inicio */
.dias{display:flex;align-items:center;gap:16px}
.dias .grande{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.03em}
.dias .sep{display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-sem{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cal-dia{height:44px;border-radius:10px;border:0;padding:0;font-size:13px;font-weight:500;background:var(--l0);color:var(--ink)}
.cal-dia.n1{background:var(--l1)} .cal-dia.n2{background:var(--l2)} .cal-dia.n3{background:var(--l3);color:var(--l3-ink)}
.cal-dia.futuro{background:transparent;color:var(--muted)}
.cal-dia.hoy{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.cal-dia[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.leyenda{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.leyenda i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* nav inferior */
.nav{flex:0 0 auto;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;min-height:44px;padding:0}
.nav button span.p{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button[aria-current="page"] span.p{background:var(--soft)}

/* sesión */
.ses-cab{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.ses-cab h1{margin:0;font-size:21px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-cab .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ej-cerrado{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ej-cerrado>button.abrir{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;border:0;background:transparent;text-align:left;padding:0}
.bola{flex:0 0 auto;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--muted);font-size:13px;font-weight:700}
.bola.lista{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ej-nom{font-size:16px;font-weight:600;display:block}
.ej-res{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ej-abierto{display:flex;flex-direction:column;gap:10px;padding:12px 12px 10px;border-radius:18px;background:var(--surface);border:1.5px solid var(--accent)}
.ej-abierto h2{font-size:19px;line-height:1.2;font-weight:700}
.miniatura{flex:0 0 auto;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--track);display:flex;align-items:center;justify-content:center;color:var(--muted);border:0;padding:0}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block}
.ilus-par{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.ilus-par figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.ilus-par img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;background:#DCEFF8}
.ilus-par figcaption{font-size:12px;color:var(--muted)}
.mapa-figs.chico svg{height:190px}
.sug{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--ink)}
.sug.descarga{background:var(--warn-bg);color:var(--warn-ink)}
.sug .tag{font-size:11px;font-weight:700;letter-spacing:.04em}
.encabezado-series{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.serie{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:0 -12px;padding:0 12px}
.serie.cal{background:var(--cal-bg)}
.serie .r{display:flex;align-items:center;gap:6px;min-height:66px}
.serie .n{flex:0 0 auto;width:36px;height:44px;border:0;border-radius:8px;padding:0;background:transparent;font-size:15px;font-weight:700}
.serie.cal .n{background:var(--track);color:var(--muted)}
.celda{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:10px;background:transparent;display:flex;align-items:baseline;gap:3px;line-height:52px;padding:0 6px}
.celda.peso{justify-content:flex-end}
.celda .v{font-size:25px;font-weight:500;letter-spacing:-.01em}
.serie.cal .celda .v{font-size:19px}
.celda .u{font-size:13px;color:var(--muted)}
.celda.fantasma{color:var(--ghost)}
.celda.hecha .v{font-weight:700}
.celda.vacia{border:1.5px dashed var(--dash);color:var(--muted)}
.celda.vacia .v{font-size:15px}
.por{flex:0 0 auto;width:12px;text-align:center;color:var(--muted)}
.rir{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;padding:0;color:var(--muted)}
.rir.con{color:var(--ink)}
.ok:not(.pildora){flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.ok[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ok.vacio{border-color:var(--dash);color:var(--dash)}
.editor{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:var(--track)}
.editor .pm{flex:0 0 auto;width:52px;height:52px;border:0;border-radius:11px;background:var(--surface);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;padding:0}
.editor .centro{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center}
.editor input{width:100%;min-width:0;height:34px;border:0;background:transparent;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.editor input:focus{outline:2px solid var(--accent);border-radius:8px}
.editor .et{font-size:11px;color:var(--muted)}
.rir-chips{display:flex;flex-direction:column;gap:6px;padding:0 0 12px 36px}
.rir-chips .g{display:flex;gap:6px}
.rir-chips button{flex:1 1 0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;padding:0}
.rir-chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.papelera-fila{flex:0 0 auto}
.descanso{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.descanso .barra{position:absolute;top:-1px;left:0;height:3px;background:var(--accent)}
.descanso .t{font-size:30px;line-height:1.05;font-weight:700}
.descanso.fin{background:var(--soft)}

/* listas */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lista>.it{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.lista>.it:first-child{border-top:0}
.lista .it .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.lista .it .txt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .it .txt span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.pestanas{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.pestanas button{flex:1 1 0;height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted)}
.pestanas button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra)}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.entrada{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.entrada{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
select.entrada{appearance:auto}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:12px;color:var(--muted);font-weight:400}
.error{font-size:13px;color:var(--danger);font-weight:600}
.comp-lista{margin:10px 0 0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:8px}
.comp-lista li{display:list-item}
.comp-lista li>b,.comp-lista li>span{display:block}
.comp-lista li>span{font-size:13px;color:var(--muted)}
.comp-lista li>.nota-ej{color:var(--accent);font-weight:600}
.comp-lista li.omitido{opacity:.6}
.comp-chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;min-height:44px}
.comp-chk input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
.paso{display:flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.paso button{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:10px;background:var(--surface);box-shadow:var(--sombra);font-size:20px;font-weight:600;padding:0}
.paso span{flex:1 1 auto;text-align:center;font-weight:700;font-size:18px}

/* gráficos */
svg.graf{width:100%;height:auto;display:block}
svg.graf text{fill:var(--muted);font-size:10px;font-family:inherit}
.vol{display:flex;align-items:center;gap:8px;height:30px}
.vol .g{width:84px;font-size:14px;font-weight:500;flex:0 0 auto}
.vol .pista{position:relative;flex:1 1 auto;height:28px;border-radius:6px;background:var(--track)}
.vol .banda{position:absolute;top:0;bottom:0;left:41.67%;width:41.66%;background:var(--band);border-left:1px solid var(--band-line);border-right:1px solid var(--band-line)}
.vol .b{position:absolute;top:7px;height:14px;left:0;border-radius:0 7px 7px 0}
.vol .v{width:30px;text-align:right;font-size:16px;font-weight:700;flex:0 0 auto}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cifra{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.cifra .k{font-size:12px;font-weight:600;color:var(--muted)}
.cifra .v{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra .v small{font-size:13px;font-weight:500;color:var(--muted)}
.marca{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--track);color:var(--muted);white-space:nowrap}
.marca.record{background:var(--warn-bg);color:var(--warn-ink)}
.marca.mas{background:var(--soft);color:var(--accent)}
.semana-dots{display:flex;gap:6px}
.semana-dots span{flex:1 1 0;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--l0);color:var(--muted)}
.semana-dots span.habitual{box-shadow:inset 0 0 0 1px var(--dash)}
.semana-dots span.hecho{background:var(--accent);color:var(--on-accent);box-shadow:none}
.semana-dots span.esta{outline:2px solid var(--ink);outline-offset:1px}

/* capas */
.velo{position:fixed;inset:0;background:var(--velo);display:flex;flex-direction:column;justify-content:flex-end;z-index:50}
.velo.centro{justify-content:center;padding:16px}
.hoja{background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;max-width:560px;width:100%;margin:0 auto}
.hoja .asa{align-self:center;width:36px;height:4px;border-radius:2px;background:var(--line)}
.dialogo{background:var(--bg);border-radius:20px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto;max-height:86vh;overflow-y:auto}
.dialogo h2{font-size:19px;font-weight:700}
.dialogo .cuerpo{font-size:15px;line-height:1.45}

/* ── consultas básicas ─────────────────────────────────────────────────── */
const ejercicioPorId = (estado, id) => arr(estado && estado.ejercicios).find((e) => e.id === id) || null;

function seriesDe(sesion) {
  const out = [];

/* ── sugerencia de carga: progresión doble y descarga ──────────────────

   1. Descarga: round() dejaba igual los pesos ≤ 12,5 kg; ahora baja al menos un

   2. «Subir» exige que las series de trabajo al peso top que llegaron al techo
      sean al menos las planificadas para hoy (no basta una).
   3. Usa la última sesión con series de TRABAJO del ejercicio, anterior a la
      sesión que se anota (ultimaVez ya lo hace). */
function sugerencia(estado, ejercicioId, ref, planSeries) {
  const e = ejercicioPorId(estado, ejercicioId);
  if (!e) return null;
  const aj = ajustesDe(estado);
  const u = ultimaVez(estado, ejercicioId, ref);
  if (!u) return null;
  const trabajo = u.series.filter((x) => x.tipo === "trabajo");
  const top = Math.max.apply(null, trabajo.map((x) => x.peso));
  const enTop = trabajo.filter((x) => x.peso === top);
  const minReps = Math.min.apply(null, enTop.map((x) => x.reps));
  const salto = e.salto > 0 ? e.salto : 2.5;
  const plan = Math.max(1, Math.round(planSeries || e.series || 3));
  const logradas = enTop.filter((x) => x.reps >= e.reps_max && (x.rir == null || x.rir <= aj.rir_para_subir)).length;
  const ult = ultimaConTrabajo(estado, ref);
  const fechaRef = ref && esFecha(ref.fecha) ? ref.fecha : null;
  const dias = ult && fechaRef ? difDias(ult.fecha, fechaRef) : 0;
  const base = { desde: { sesion_id: u.sesion.id, fecha: u.sesion.fecha }, ultima: u.series, top: top, logradas: logradas, plan: plan, dias: dias };

  if (dias >= aj.descarga_dias) {
    let p = 0;
    if (top > 0) {

      p = r2(Math.max(0, Math.min(piso, top - salto)));

  }
  if (logradas >= plan) {

  }
  return Object.assign(base, { regla: "repetir", peso: top, reps: Math.min(minReps + 1, e.reps_max),
    motivo: logradas > 0

/** Una fila de la pantalla de sesión (pendiente hasta el ✓). */
function nuevaFila(d) {
  return { id: nuevoId(), tipo: d.tipo === "calentamiento" ? "calentamiento" : "trabajo",

  }

/* ── rutinas ─────────────────────────────────────────────────────────── */
function rutinasOrdenadas(estado) { return arr(estado && estado.rutinas).slice().sort((a, b) => numO(a.orden, 0) - numO(b.orden, 0) || numO(a.creada_en, 0) - numO(b.creada_en, 0)); }

  const lista = arr(estado.rutinas);
  if (lista.some((r) => r.id !== datos.id && r.nombre.trim().toLowerCase() === nombre.toLowerCase())) return { ok: false, error: "Ya hay una rutina con ese nombre." };
  const vistos = new Set();

/** Arma una sesión nueva (no la agrega al estado). modo: rutina | repetir | blanco. */
function empezarSesion(estado, op) {

  const hoy = esFecha(op.hoy) ? op.hoy : fechaDeMs(ahora);
  const s = { id: nuevoId(), fecha: hoy, rutina_id: null, rutina_nombre: null, iniciada_en: ahora, terminada_en: null, nota: "", descanso: null, ejercicios: [] };
  const ref = { id: s.id, fecha: s.fecha, iniciada_en: ahora };

    const r = arr(estado.rutinas).find((x) => x.id === op.rutina_id);
    if (r) { s.rutina_id = r.id; s.rutina_nombre = r.nombre; pares = r.ejercicios.map((x) => [x.ejercicio_id, x.series]); }
  } else if (op.modo === "repetir") {
    const previa = arr(estado.sesiones).filter((x) => arr(x.ejercicios).length && x.id !== s.id && esFecha(x.fecha)).sort(ordenSesion).pop();
    if (previa) { s.rutina_id = previa.rutina_id; s.rutina_nombre = previa.rutina_nombre; pares = previa.ejercicios.map((b) => [b.ejercicio_id, b.series_plan]); }
  }
  for (const p of pares) {
    const e = ejercicioPorId(estado, p[0]);

}
/** La última sesión con plan, para «Repetir». */
function sesionParaRepetir(estado) {

}

/* ── constancia: UNA sola función para el número y el aviso ────────────
   «Días sin entrenar» = días HABITUALES que ya pasaron sin sesión con trabajo
   desde la última (hoy no cuenta: todavía se puede ir). El aviso sale de este
   mismo número contra el umbral, así que nunca discrepan. */
function constancia(estado, hoy) {
  const aj = ajustesDe(estado);
  if (!esFecha(hoy)) hoy = fechaLocal();
  let ultima = null;
  for (const s of sesionesValidas(estado)) {
    if (s.fecha <= hoy && tieneTrabajo(s) && (!ultima || s.fecha > ultima)) ultima = s.fecha;
  }
  const res = { ultimaFecha: ultima, diasCorridos: null, diasSinEntrenar: 0, perdidos: [], aviso: false,
    umbral: aj.aviso_dias, habituales: aj.dias_habituales, textoAviso: null };
  if (!ultima) return res;
  const corridos = difDias(ultima, hoy);
  res.diasCorridos = corridos;
  const limite = Math.min(corridos, 20000);
  let cuenta = 0;
  for (let i = 1; i < limite; i++) {
    const f = sumarDias(ultima, i);
    if (aj.dias_habituales.indexOf(diaIso(f)) >= 0) { cuenta += 1; res.perdidos.push(f); if (res.perdidos.length > 7) res.perdidos.shift(); }
  }
  res.diasSinEntrenar = cuenta;

}
function textoAvisoConstancia(n, perdidos) {

  const nombres = ult.length <= 1 ? ult.join("") : ult.slice(0, -1).join(", ") + " y " + ult[ult.length - 1];
  return { titulo: "Van " + n + (n === 1 ? " día" : " días") + " de entreno sin ir",
    detalle: nombres ? (n > ult.length ? "Los últimos: " : "") + nombres + "." : "" };
}

/* ── volumen semanal (gym.v_volumen_semana) ─────────────────────────── */
function volumenSemana(estado, lunes) {
  const fin = sumarDias(lunes, 6);
  const mapa = {};
  GRUPOS.forEach((g) => { mapa[g.valor] = { grupo: g.valor, texto: g.texto, series: 0, directas: 0, min: SERIES_MIN, max: SERIES_MAX }; });
  if (!fin) return GRUPOS.map((g) => mapa[g.valor]);
  for (const s of sesionesValidas(estado)) {
    if (s.fecha < lunes || s.fecha > fin) continue;
    for (const x of seriesDe(s)) {
      if (!esEfectiva(x)) continue;
      const e = ejercicioPorId(estado, x.ejercicio_id);
      if (!e) continue;
      if (mapa[e.grupo]) { mapa[e.grupo].series += 1; mapa[e.grupo].directas += 1; }
      for (const g of arr(e.secundarios)) if (g !== e.grupo && mapa[g]) mapa[g].series += 0.5;
    }
  }
  return GRUPOS.map((g) => mapa[g.valor]);
}

/* ── músculos trabajados (mapa muscular): mismo criterio que el volumen semanal ──
   Serie efectiva = 1 al grupo principal y 0,5 a cada secundario. Devuelve { grupo: series }. */
function musculosDeSeries(estado, series) {
  const m = {};
  for (const x of arr(series)) {
    if (!esEfectiva(x)) continue;
    const e = ejercicioPorId(estado, x.ejercicio_id);
    if (!e) continue;
    m[e.grupo] = (m[e.grupo] || 0) + 1;
    for (const g of arr(e.secundarios)) if (g !== e.grupo) m[g] = (m[g] || 0) + 0.5;
  }
  return m;
}

/* ── calendario (gym.v_dia) ──────────────────────────────────────────── */
function nivelDia(series) { return series <= 0 ? 0 : series < 14 ? 1 : series <= 18 ? 2 : 3; }

  const m = {};

    const t = seriesDe(s).filter((x) => x.tipo === "trabajo");
    if (!t.length) continue;
    const d = m[s.fecha] || (m[s.fecha] = { fecha: s.fecha, series: 0, grupos: [], sesiones: [] });
    d.series += t.length;
    d.sesiones.push({ id: s.id, series: t.length, nombre: s.rutina_nombre });
    for (const x of t) { const e = ejercicioPorId(estado, x.ejercicio_id); if (e && d.grupos.indexOf(e.grupo) < 0) d.grupos.push(e.grupo); }
  }

  const nDias = new Date(Date.UTC(p.a, p.m, 0)).getUTCDate();
  const ultimo = mes + "-" + dos(nDias);

    if (info) sesiones += info.sesiones.length;
    celdas.push({ fecha: f, n: d, series: info ? info.series : 0, nivel: info ? nivelDia(info.series) : 0, grupos: info ? info.grupos : [],
      sesiones: info ? info.sesiones : [], hoy: f === hoy, futuro: f > hoy });
  }
  return { mes: mes, titulo: mayuscula(NOMBRES_MES[p.m - 1]) + (String(p.a) === String(hoy).slice(0, 4) ? "" : " " + p.a), celdas: celdas, sesiones: sesiones };
}

  const t = p.a * 12 + (p.m - 1) + n;
  return Math.floor(t / 12) + "-" + dos((t % 12) + 1);
}

/* ── historial y gráfico por ejercicio ───────────────────────────────── */
function historialEjercicio(estado, ejercicioId) {

    if (!ser.length) continue;
    const t = ser.filter((x) => x.tipo === "trabajo");
    out.push({ sesion: s, fecha: s.fecha, series: ser,
      top: t.length ? Math.max.apply(null, t.map((x) => x.peso)) : null,
      e1rm: t.reduce((m, x) => Math.max(m, unoRM(x.peso, x.reps, x.rir) || 0), 0) || null });

}
/** Un punto por fecha: peso top de trabajo y mejor 1RM estimado (v_1rm). */

  const m = {};

    if (h.top == null) continue;
    const p = m[h.fecha] || (m[h.fecha] = { fecha: h.fecha, top: 0, e1rm: null });
    p.top = Math.max(p.top, h.top);

}
function resumenSeries(series) {

  const mismo = series.every((s) => s.peso === series[0].peso);
  if (mismo) return (series[0].peso > 0 ? kg(series[0].peso) : "PC") + " × " + reps;
  return series.map((s) => (s.peso > 0 ? kg(s.peso) : "PC") + " × " + s.reps).join(", ");
}

/* ── resumen que celebra ─────────────────────────────────────────────── */
const volumen = (series) => series.reduce((t, x) => t + x.peso * x.reps, 0);
function resumenSesion(estado, sesionId, ahora) {
  const s = sesionPorId(estado, sesionId);
  if (!s) return null;
  ahora = ahora || Date.now();
  const todas = seriesDe(s), trabajo = todas.filter((x) => x.tipo === "trabajo");
  const ini = numO(s.iniciada_en, null), fin = numO(s.terminada_en, ahora);
  const minutos = ini === null ? null : Math.max(1, Math.round((fin - ini) / 60000));
  const anteriores = esFecha(s.fecha) ? sesionesValidas(estado).filter((x) => x.id !== s.id && esAnterior(x, s)) : [];
  const ejercicios = [], records = [];
  let hoyFrente = 0, antesFrente = 0;
  for (const b of arr(s.ejercicios)) {
    const e = ejercicioPorId(estado, b.ejercicio_id);
    const ser = trabajo.filter((x) => x.ejercicio_id === b.ejercicio_id);
    if (!e || !ser.length) continue;
    let pesoAntes = 0, rmAntes = 0, hayAntes = false;
    for (const a of anteriores) for (const x of seriesDe(a)) {
      if (x.ejercicio_id !== e.id || x.tipo !== "trabajo") continue;
      hayAntes = true; pesoAntes = Math.max(pesoAntes, x.peso); rmAntes = Math.max(rmAntes, unoRM(x.peso, x.reps, x.rir) || 0);
    }
    const pesoHoy = Math.max.apply(null, ser.map((x) => x.peso));
    const rmHoy = ser.reduce((m, x) => Math.max(m, unoRM(x.peso, x.reps, x.rir) || 0), 0);
    const recPeso = hayAntes && pesoHoy > 0 && pesoHoy > pesoAntes;
    const recRM = hayAntes && rmHoy > 0 && rmAntes > 0 && rmHoy > rmAntes;
    if (recPeso) records.push({ nombre: e.nombre, tipo: "peso", hoy: pesoHoy, antes: pesoAntes });
    if (recRM) records.push({ nombre: e.nombre, tipo: "1rm", hoy: rmHoy, antes: rmAntes });
    const u = esFecha(s.fecha) ? ultimaVez(estado, e.id, s) : null;
    const previas = u ? u.series.filter((x) => x.tipo === "trabajo") : [];
    const vHoy = volumen(ser), vAntes = volumen(previas);
    if (previas.length) { hoyFrente += vHoy; antesFrente += vAntes; }
    ejercicios.push({ id: e.id, nombre: e.nombre, series: ser, antes: previas, e1rm: rmHoy || null,
      marca: recPeso || recRM ? "record" : !previas.length ? "nuevo" : vHoy > vAntes ? "mas" : vHoy === vAntes ? "igual" : "menos" });
  }

  const semana = [];

    const lunes = lunesDe(s.fecha);
    const desde = sumarDias(lunes, -7 * 104);
    const dias = diasConTrabajo(estado, desde, sumarDias(lunes, 6));
    for (let l = lunes; l >= desde; l = sumarDias(l, -7)) {
      let hay = l === lunes && trabajo.length > 0;
      for (let i = 0; i < 7 && !hay; i++) { const f = sumarDias(l, i); if (dias[f] && (l !== lunes || f <= s.fecha)) hay = true; }
      if (!hay) break;
      racha += 1;
    }
    for (let i = 0; i < 7; i++) {
      const f = sumarDias(lunes, i);
      semana.push({ fecha: f, letra: DIAS_CORTOS[i], hecho: !!dias[f] || (f === s.fecha && trabajo.length > 0), habitual: aj.dias_habituales.indexOf(i + 1) >= 0, esta: f === s.fecha });
    }
  }
  const nRec = new Set(records.map((r) => r.nombre)).size;
  const supero = antesFrente > 0 && hoyFrente > antesFrente;
  return {
    sesion: s, fecha: s.fecha, nombre: s.rutina_nombre || "Sesión", minutos: minutos, series: trabajo.length,
    calentamiento: todas.length - trabajo.length, kilos: Math.round(volumen(trabajo)), ejercicios: ejercicios, records: records,
    ejerciciosConRecord: nRec, frente: antesFrente > 0 ? { hoy: Math.round(hoyFrente), antes: Math.round(antesFrente) } : null,
    racha: racha, semana: semana, musculos: musculosDeSeries(estado, trabajo),
    titulo: nRec > 1 ? "¡" + nRec + " récords!" : nRec === 1 ? "¡Nuevo récord!" : supero ? "¡Más que la vez pasada!" : trabajo.length ? "Sesión terminada" : "Sesión sin series de trabajo"
  };
}

  { peso: 180000, uno: "un Boeing 747", varios: "Boeing 747", icono: "🛫" },

  }
  return Math.round(t);
}

/* ── Rutina Recap: resumen del año (PLAN_RECAP_2026.md) ──────────────────

  else if (conHora >= 4 && noche / conHora >= 0.6) franja = { tipo: "noche", pct: Math.round(noche / conHora * 100), titulo: gen("Noctámbulo del gym", "Noctámbula del gym", "Noches de gym"), texto: "El " + Math.round(noche / conHora * 100) + " % de tus sesiones empezó después de las 19:00" };

    if (dias.length < 4 || difDias(dias[0], dias[dias.length - 1]) < 30) continue;
    const limIni = sumarDias(dias[0], 29), limFin = sumarDias(dias[dias.length - 1], -29);
    const ini = Math.max.apply(null, dias.filter((f) => f <= limIni).map((f) => porEj[k].sesiones[f]));
    const finP = Math.max.apply(null, dias.filter((f) => f >= limFin).map((f) => porEj[k].sesiones[f]));
    if (!(ini > 0) || !(finP > ini)) continue;
    const pct = (finP - ini) / ini;
    if (!mejorado || pct > mejorado.pct) mejorado = { id: k, nombre: nombreEj(k), desde: ini, hasta: finP, pct: pct };
  }
  if (mejorado) mejorado.texto = "de " + kg(mejorado.desde) + " a " + kg(mejorado.hasta) + " kg (+" + Math.round(mejorado.pct * 100) + " %)";
  // récords de peso del año: veces que el peso top de un ejercicio superó todo lo anterior (también lo de años previos)
  let records = 0;
  const maxPrevio = {};
  for (const s of sesionesValidas(estado).filter((x) => x.fecha <= hasta).sort(ordenSesion)) {
    const hoyMax = {};
    for (const x of seriesDe(s)) if (x.tipo === "trabajo") hoyMax[x.ejercicio_id] = Math.max(hoyMax[x.ejercicio_id] || 0, x.peso);
    for (const id of Object.keys(hoyMax)) {
      if (s.fecha >= desde && maxPrevio[id] != null && hoyMax[id] > 0 && hoyMax[id] > maxPrevio[id]) records += 1;
      maxPrevio[id] = Math.max(maxPrevio[id] == null ? 0 : maxPrevio[id], hoyMax[id]);
    }
  }

  // mapa muscular del año
  const musculos = musculosDeSeries(estado, seriesAnio);
  const totalMus = GRUPOS.reduce((t, g) => t + (musculos[g.valor] || 0), 0);
  const media = totalMus / GRUPOS.length;
  const dominante = GRUPOS.map((g) => g.valor).sort((a, b) => (musculos[b] || 0) - (musculos[a] || 0))[0];
  const parejo = media > 0 && (musculos[dominante] || 0) <= 1.5 * media;
  const poco = (g) => (musculos[g] || 0) < 0.25 * media;
  const broma = media <= 0 ? null : ["cuadriceps", "femoral", "gluteo"].some(poco) ? "Las piernas te extrañan 😅"
    : poco("espalda") ? "La espalda te extraña 😅" : poco("pecho") ? "El pecho te extraña 😅" : null;
  const mapa = {
    musculos: musculos, dominante: dominante,
    cortes: [1, Math.round(6 * semanasConApp), Math.round(12 * semanasConApp)],      // los cortes semanales (1 · 6 · 12) por las semanas con la app
    titulo: parejo ? "Simetría total" : TITULOS_MAPA[dominante] || "Tu mapa del año",
    texto: parejo ? "No dejaste ningún músculo atrás" : "Lo que más trabajaste: " + textoGrupo(dominante) + " · " + miles(musculos[dominante]) + " series",
    broma: broma
  };

  // peso corporal (solo con 2+ registros en el año)
  let peso = null;
  const regs = pesosOrdenados(estado).filter((p) => p.fecha >= desde && p.fecha <= hasta);
  if (regs.length >= 2) {
    const delta = r2(regs[regs.length - 1].kg - regs[0].kg), o = pf.objetivo, abs = kg(Math.abs(delta));
    let titulo, texto;
    if (o === "ganar" && delta > 0) { titulo = "Ganaste " + abs + " kg"; texto = "Justo lo que buscabas"; }
    else if (o === "bajar" && delta < 0) { titulo = "Bajaste " + abs + " kg"; texto = "Tu constancia se nota"; }
    else if (o === "mantener" && Math.abs(delta) <= 1.5) { titulo = "Te mantuviste firme"; texto = "Todo el año en tu peso"; }
    else { titulo = "Registraste tu peso " + regs.length + " veces"; texto = "Conocerte también es entrenar"; }
    peso = { registros: regs.length, delta: delta, objetivo: o, titulo: titulo, texto: texto, puntos: regs.map((p) => ({ fecha: p.fecha, kg: p.kg })) };
  }

  // tu tipo de atleta: el primero que aplique
  const mediaReps = seriesTotal ? repsTotal / seriesTotal : 0;
  const seriesPorSesion = seriesTotal / sesiones.length;
  const parte = (gs) => (totalMus > 0 ? gs.reduce((t, g) => t + (musculos[g] || 0), 0) / totalMus : 0);
  const empuje = parte(["pecho", "hombro", "triceps"]), piernas = parte(["cuadriceps", "femoral", "gluteo", "pantorrilla"]);
  const distintos = Object.keys(porEj).length;
  let arquetipo;
  if (mejorRacha >= 8 || pctSemanas2 >= 0.8) arquetipo = { clave: "constante", titulo: gen("El Constante", "La Constante", "Constancia pura"), icono: "🗓️",
    texto: mejorRacha >= 8 ? mejorRacha + " semanas seguidas sin fallar" : Math.round(pctSemanas2 * 100) + " % de tus semanas con 2 sesiones o más" };
  else if (mediaReps > 0 && mediaReps <= 6) arquetipo = { clave: "fuerza", titulo: "Fuerza bruta", icono: "🏋️", texto: "Pocas y pesadas: " + kg(r1(mediaReps)) + " repeticiones por serie en promedio" };
  else if (seriesPorSesion >= 18) arquetipo = { clave: "volumen", titulo: "La máquina de volumen", icono: "⚙️", texto: kg(r1(seriesPorSesion)) + " series por sesión en promedio" };
  else if (empuje > 0.45) arquetipo = { clave: "press", titulo: gen("Rey del press", "Reina del press", "Realeza del press"), icono: "👑", texto: "El " + Math.round(empuje * 100) + " % de tu trabajo fue de empuje" };
  else if (piernas > 0.45) arquetipo = { clave: "piernas", titulo: "Piernas que no perdonan", icono: "🦵", texto: "El " + Math.round(piernas * 100) + " % de tu trabajo fue de piernas" };
  else if (distintos >= 25) arquetipo = { clave: "explorador", titulo: gen("El Explorador", "La Exploradora", "Espíritu explorador"), icono: "🧭", texto: "Probaste " + distintos + " ejercicios distintos" };
  else arquetipo = { clave: "construccion", titulo: "Atleta en construcción", icono: "🔨", texto: "Cada sesión suma. El próximo año, más" };

  const pantallas = ["portada", "constancia", "kilos", "ejercicios", "mapa"].concat(peso ? ["peso"] : []).concat(["arquetipo", "final"]);
  return Object.assign(base, {
    pocas: false, pantallas: pantallas, desde: desde, hasta: hasta, inicio: inicio, fin: fin,
    diasConApp: diasConApp, semanasConApp: semanasConApp, tarde: tarde,
    intro: tarde ? "En tus " + semanasConApp + (semanasConApp === 1 ? " semana" : " semanas") + " con Rutina…" : "Tu año en el gym",
    sesiones: sesiones.length, horas: horas, mejorRacha: mejorRacha, pctSemanas2: pctSemanas2, diaFavorito: diaFavorito, franja: franja,
    kilos: kilos, equivalencia: equivalencia(kilos), series: seriesTotal, repeticiones: repsTotal, ejerciciosDistintos: distintos,
    top: top, mejorado: mejorado, records: records, mapa: mapa, peso: peso, arquetipo: arquetipo
  });
}

/* ── peso corporal ───────────────────────────────────────────────────── */
function pesosOrdenados(estado) {
  return arr(estado && estado.peso_corporal).filter((p) => esFecha(p.fecha) && typeof p.kg === "number" && p.kg > 0)
    .slice().sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
}
/** Promedio móvil por TIEMPO: los registros de los últimos `dias` días hasta cada fecha. */
function promedioMovil(registros, dias) {
  dias = dias || 7;
  return registros.map((r) => {
    const desde = sumarDias(r.fecha, -(dias - 1));
    const v = registros.filter((x) => x.fecha >= desde && x.fecha <= r.fecha);
    return { fecha: r.fecha, kg: r.kg, prom: r2(v.reduce((t, x) => t + x.kg, 0) / v.length), n: v.length };
  });
}
/** Cambio frente al registro más reciente con fecha ≤ (último − días). */
function cambioPeso(registros, dias) {
  if (!registros.length) return null;
  const ult = registros[registros.length - 1];
  const objetivo = sumarDias(ult.fecha, -dias);
  let ref = null;
  for (const r of registros) if (r.fecha <= objetivo) ref = r;
  return ref ? { delta: r2(ult.kg - ref.kg), desde: ref.fecha } : null;
}
/** Cambio desde el inicio: contra el registro de la bienvenida (si sigue), o el peso inicial, o el primero. */
function cambioDesdeInicio(estado) {
  const regs = pesosOrdenados(estado);
  if (!regs.length) return null;
  const ult = regs[regs.length - 1], pf = sanearPerfil(estado.perfil);
  let ref = regs.find((r) => r.id === pf.registro_inicial_id) || null;
  if (!ref && pf.peso_inicial) ref = { kg: pf.peso_inicial, fecha: pf.fecha_inicio };
  if (!ref) ref = regs[0];
  return { delta: r2(ult.kg - ref.kg), desde: ref.fecha, inicial: ref.kg };
}
/** Uno por día: si ya hay registro en esa fecha, se reemplaza. Devuelve la lista nueva. */
function registrarPeso(estado, datos, hoy) {
  const f = typeof datos.fecha === "string" ? datos.fecha.trim() : "";
  if (!esFecha(f)) return { ok: false, error: "La fecha no es válida." };
  if (esFecha(hoy) && f > hoy) return { ok: false, error: "Esa fecha todavía no llega." };
  const k = leerNumero(datos.kg);
  if (k === null || k < 20 || k > 400) return { ok: false, error: "Anota un peso entre 20 y 400 kg." };
  const lista = arr(estado.peso_corporal);
  const previo = lista.find((p) => p.fecha === f && p.id !== datos.id);
  const id = datos.id || (previo ? previo.id : nuevoId());
  const reg = { id: id, fecha: f, kg: r2(k), nota: String(datos.nota || "").trim().slice(0, 200) };
  const sinEse = lista.filter((p) => p.id !== id && p.fecha !== f);
  return { ok: true, lista: sinEse.concat([reg]), reemplazo: !!previo, registro: reg };
}

/* ── rutina compartida por enlace (#r=…) ─────────────────────────────────
   Formato v1 (JSON compacto): { v: 1, n: nombre, e: [ejercicio…] }
     base:   { b: base_codigo, s: series [, r: [min, max]] [, j: salto] }   (r/j solo si difieren del catálogo)
     propio: { p: { n, g, x: secundarios, q: equipo, j: salto, r: [min, max], d: series por omisión, t: descanso_s }, s }
   Nada personal: ni historial, ni pesos, ni peso corporal, ni nombre del usuario, ni ids, ni fotos. */
const COMP_VERSION = 1, COMP_MAX_EJ = 30, COMP_MAX_NOMBRE = 60;
const baseDe = (codigo) => BASE.find((b) => b[0] === codigo) || null;
/** «Press  Inclinado» → «press inclinado» (sin tildes, mayúsculas ni espacios de más). */
const normalNombre = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const cortarNombre = (t) => String(t || "").replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, COMP_MAX_NOMBRE).trim();
/* Al compartir, sin «<» ni «>» (al recibir se rechazan: así un nombre con etiquetas delata un enlace manipulado). */
const nombreParaCompartir = (t) => cortarNombre(String(t || "").replace(/[<>]/g, " "));
/** Arma la carga de una rutina ({nombre, ejercicios:[{ejercicio_id, series}]}). Los ejercicios que ya no existen se omiten. */
function cargaDeRutina(estado, rutina) {
  const e = [];
  for (const x of arr(rutina && rutina.ejercicios)) {
    const ej = ejercicioPorId(estado, x.ejercicio_id);
    if (!ej) continue;
    const s = Math.min(10, Math.max(1, Math.round(numO(x.series, 3))));
    const b = ej.base_codigo ? baseDe(ej.base_codigo) : null;
    /* Dentro de los topes que valida quien recibe (reps 1–100, salto ≤ 50). */
    const rmin = Math.min(100, Math.max(1, ej.reps_min)), rmax = Math.min(100, Math.max(rmin, ej.reps_max)), salto = Math.min(50, ej.salto > 0 ? ej.salto : 2.5);
    if (b) {
      const it = { b: b[0], s: s };
      if (rmin !== b[5] || rmax !== b[6]) it.r = [rmin, rmax];
      if (salto !== 2.5) it.j = salto;
      e.push(it);
    } else {
      e.push({ p: { n: nombreParaCompartir(ej.nombre) || "Ejercicio", g: ej.grupo, x: arr(ej.secundarios).filter((g) => g !== ej.grupo), q: ej.equipo, j: salto,
        r: [rmin, rmax], d: ej.series, t: ej.descanso_s }, s: s });
    }
  }
  return { v: COMP_VERSION, n: nombreParaCompartir(rutina && rutina.nombre) || "Rutina", e: e };
}
/** Validación estricta de lo recibido (puede venir dañado o manipulado). → { ok, datos } | { ok:false, error } */
function validarCarga(o) {
  const mal = (por) => ({ ok: false, error: "danado", por: por });
  const entero = (v, a, b) => typeof v === "number" && Number.isInteger(v) && v >= a && v <= b;
  const nombre = (v) => typeof v === "string" && v.length <= 200 && !/[<>]/.test(v) && cortarNombre(v).length >= 1 && cortarNombre(v).length <= COMP_MAX_NOMBRE && v.trim().length <= COMP_MAX_NOMBRE;
  const salto = (v) => typeof v === "number" && isFinite(v) && v > 0 && v <= 50;
  const rango = (v) => Array.isArray(v) && v.length === 2 && entero(v[0], 1, 100) && entero(v[1], 1, 100) && v[0] <= v[1];
  if (!o || typeof o !== "object" || Array.isArray(o)) return mal("no es objeto");
  if (typeof o.v !== "number") return mal("sin versión");
  if (o.v > COMP_VERSION) return { ok: false, error: "nueva", por: "versión " + o.v };
  if (o.v !== COMP_VERSION) return mal("versión");
  if (!nombre(o.n)) return mal("nombre");
  if (!Array.isArray(o.e) || !o.e.length) return mal("sin ejercicios");
  if (o.e.length > COMP_MAX_EJ) return mal("demasiados ejercicios");
  const ejercicios = [];
  for (const it of o.e) {
    if (!it || typeof it !== "object" || Array.isArray(it)) return mal("ejercicio");
    if (!entero(it.s, 1, 10)) return mal("series");
    if (("b" in it) === ("p" in it)) return mal("base o propio");
    if ("b" in it) {
      if (typeof it.b !== "string" || !/^[a-z_]{1,30}$/.test(it.b)) return mal("base_codigo");
      if ("r" in it && !rango(it.r)) return mal("reps base");
      if ("j" in it && !salto(it.j)) return mal("salto base");
      ejercicios.push({ tipo: "base", codigo: it.b, series: it.s, reps: it.r ? it.r.slice() : null, salto: "j" in it ? r2(it.j) : null });
    } else {
      const p = it.p;
      if (!p || typeof p !== "object" || Array.isArray(p)) return mal("propio");
      if (!nombre(p.n)) return mal("nombre propio");
      if (!GRUPOS.some((g) => g.valor === p.g)) return mal("grupo");
      if (!Array.isArray(p.x) || p.x.length > GRUPOS.length || !p.x.every((g) => GRUPOS.some((x) => x.valor === g) && g !== p.g) || new Set(p.x).size !== p.x.length) return mal("secundarios");
      if (!EQUIPOS.some((q) => q.valor === p.q)) return mal("equipo");
      if (!salto(p.j)) return mal("salto");
      if (!rango(p.r)) return mal("reps");
      if (!entero(p.d, 1, 10)) return mal("series por omisión");
      if (!entero(p.t, 15, 600)) return mal("descanso");
      ejercicios.push({ tipo: "propio", series: it.s, def: { nombre: cortarNombre(p.n), grupo: p.g, secundarios: p.x.slice(), equipo: p.q, salto: r2(p.j),
        reps_min: p.r[0], reps_max: p.r[1], series: p.d, descanso_s: p.t } });

}
/** «Empuje» → «Empuje (compartida)», «Empuje (compartida 2)»… si ya existe. Nunca reemplaza una rutina. */
function nombreRutinaLibre(estado, nombre) {
  const usados = new Set(arr(estado && estado.rutinas).map((r) => String(r.nombre || "").trim().toLowerCase()));
  if (!usados.has(nombre.toLowerCase())) return nombre;
  for (let i = 1; i < 1000; i++) {
    const suf = i === 1 ? " (compartida)" : " (compartida " + i + ")";
    const t = nombre.slice(0, COMP_MAX_NOMBRE - suf.length).trim() + suf;
    if (!usados.has(t.toLowerCase())) return t;

/** Qué pasará al agregar (para la vista previa); no toca el estado.
    Base: por base_codigo (activo primero); si no lo tengo, por nombre del catálogo; si no, se crea desde el catálogo
    (con el rango/salto compartido). Si existe, se usa con MI configuración. Retirado: se usa y se puede reactivar.
    Propio: reutiliza uno propio ACTIVO con el mismo nombre (normalizado) y grupo; si no, se crea. */
function planCompartida(estado, datos) {
  const ejs = arr(estado && estado.ejercicios);
  const items = [], creados = [];
  for (const x of datos.ejercicios) {
    if (x.tipo === "base") {
      const b = baseDe(x.codigo);
      const porCodigo = ejs.filter((e) => e.base_codigo === x.codigo);
      let e = porCodigo.find((y) => y.activo) || null;
      if (!e && b) e = ejs.find((y) => y.activo && normalNombre(y.nombre) === normalNombre(b[1]) && y.grupo === b[2]) || null;
      if (!e) e = porCodigo[0] || null;
      const reps = x.reps || (b ? [b[5], b[6]] : null), salto = x.salto != null ? x.salto : 2.5;
      if (e) items.push({ accion: e.activo ? "usar" : "retirado", ejercicio_id: e.id, nombre: e.nombre, series: x.series, reps: [e.reps_min, e.reps_max],
        compartido: reps, distinto: !!reps && (reps[0] !== e.reps_min || reps[1] !== e.reps_max) });
      else if (b) {
        const yaCreado = creados.find((c) => c.base_codigo === x.codigo);
        if (yaCreado) items.push({ accion: "crear", ejercicio_id: yaCreado.id, nombre: yaCreado.nombre, series: x.series, reps: [yaCreado.reps_min, yaCreado.reps_max], repetido: true });
        else {
          const n = ejercicioDesdeBase(b, Date.now());
          n.destacado = false; n.salto = salto; n.reps_min = reps[0]; n.reps_max = reps[1];
          creados.push(n);
          items.push({ accion: "crear", ejercicio_id: n.id, nombre: n.nombre, series: x.series, reps: reps });
        }
      } else items.push({ accion: "omitir", nombre: x.codigo, series: x.series, reps: x.reps });
    } else {
      const d = x.def, clave = normalNombre(d.nombre);
      const e = ejs.find((y) => y.activo && !y.base_codigo && y.grupo === d.grupo && normalNombre(y.nombre) === clave) ||
        creados.find((y) => !y.base_codigo && y.grupo === d.grupo && normalNombre(y.nombre) === clave);
      if (e) items.push({ accion: creados.indexOf(e) >= 0 ? "crear" : "usar", propio: true, ejercicio_id: e.id, nombre: e.nombre, series: x.series, reps: [e.reps_min, e.reps_max],
        compartido: [d.reps_min, d.reps_max], distinto: d.reps_min !== e.reps_min || d.reps_max !== e.reps_max, repetido: creados.indexOf(e) >= 0 });
      else {
        const n = Object.assign({ id: nuevoId(), base_codigo: null }, d, { pasos: [], destacado: false, activo: true, tiene_foto: false, creado_en: Date.now() });
        creados.push(n);
        items.push({ accion: "crear", propio: true, ejercicio_id: n.id, nombre: n.nombre, series: x.series, reps: [n.reps_min, n.reps_max] });
      }
    }
  }
  return { nombre: nombreRutinaLibre(estado, datos.nombre), nombreOriginal: datos.nombre, items: items, creados: creados,
    retirados: items.filter((i) => i.accion === "retirado").map((i) => i.ejercicio_id), omitidos: items.filter((i) => i.accion === "omitir").length };
}
/** Arma las listas nuevas completas (ejercicios y rutinas) sin tocar el estado: quien llama las asigna de una vez. */
function aplicarCompartida(estado, plan, op) {
  op = op || {};
  const reactivar = new Set(op.reactivar ? plan.retirados : []);
  const ejercicios = arr(estado.ejercicios).map((e) => (reactivar.has(e.id) ? Object.assign({}, e, { activo: true }) : e)).concat(plan.creados);
  const tmp = { ejercicios: ejercicios, rutinas: arr(estado.rutinas) };

/* ═════════════════════════════════════════════════════════════════════════
   PERSISTENCIA · adaptada de guardado.js (app de microciclos), a su vez
   derivado de persistencia-segura.js v1.0. Conserva:
     · GUARDA 1: en leer → decidir → escribir, una lectura fallida SALE; nunca escribe.
     · GUARDA 2: nunca escribir un estado vacío sobre una copia con contenido.
     · GUARDA 3: una sola pestaña a la vez con Web Locks (ifAvailable; «usar
       aquí» roba el turno con confirmación y la otra queda en solo lectura).
     · Copia ilegible: autoguardado en pausa y rescate del texto crudo.
     · Respaldo rotativo de 3 versiones en IndexedDB antes de escribir.
   Cambios para esta app: un único documento (clave "estado") en una base con
   nombre propio ("rutina-gym-v1": abierta desde Archivos, todos los HTML
   comparten el origen content://media), almacén aparte de fotos (Blob),
   diario síncrono en localStorage contra el cierre abrupto y exportación
   completa con fotos.
   Desde 2026-11-23 el respaldo es MANUAL e igual en Android e iPhone:
   «Guardar respaldo» (menú Compartir o descarga). Ya no hay archivo .json
   conectado; a quien lo tenía se le borra el vínculo recordado (nunca el
   documento) y se le avisa una sola vez. La píldora nunca dice «Guardado».
   No toca el DOM salvo para descargar: avisos y preguntas los pone la interfaz.
   ═════════════════════════════════════════════════════════════════════════ */
function crearPersistencia(cfg) {
  "use strict";
  const C = Object.assign({
    base: "rutina-gym-v1",
    documento: () => null,
    cargarDocumento: (d) => {},
    validar: (d) => ({ ok: !!d }),
    migrar: (d) => d,
    estaVacio: (d) => !d,
    resumen: (d) => "contenido",
    firma: (d) => JSON.stringify(d),
    creadoEn: (d) => (d && d.creado_en) || null,
    nombreArchivo: () => "rutina.json",
    /* preguntar(titulo, html, [{valor, texto, tono}]) → Promise<valor|null>; aviso(titulo, html) */
    preguntar: async () => null,
    aviso: () => {},
    alCambiar: () => {},
    alPerderTurno: () => {},
    descargarTexto: descargarTextoPorOmision,
    maxRespaldos: 3,
    intervaloRespaldo: 3 * 60000,
    debounce: 400,
    diasAvisoRespaldo: 3
  }, cfg || {});
  const K = "estado";
  const MS_DIA = 86400000;
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  let sucio = false, activo = false, perdioTurno = false, almacenamientoOk = true;
  let ilegible = null;                  // { crudo, motivo }
  let errorLocal = null;
  let tLocal = null, liberarTurno = null, ultimoRespaldoTs = 0;
  let ultimo = { ts: null, destino: "" };
  let ultimoExterno = null;             // último respaldo fuera del navegador (compartido o descargado)
  let migracion = null;                 // { ts, avisado } si esta app tenía un .json conectado
  let vacioAceptado = null;
  /* Bitácora de diagnóstico: solo datos técnicos (nunca nombres, pesos ni registros). */
  const CLAVE_BIT = C.base + ":bitacora";
  let bitacora = [];
  try { bitacora = JSON.parse(localStorage.getItem(CLAVE_BIT) || "[]"); if (!Array.isArray(bitacora)) bitacora = []; } catch (e) { bitacora = []; }
  const detalleError = (e) => (e ? (e.name || "Error") + ": " + (e.message || String(e)) : "desconocido");
  function anotar(ev, e) {
    const x = { t: Date.now(), ev: String(ev) };
    if (e) x.err = detalleError(e);
    bitacora.push(x);
    if (bitacora.length > 40) bitacora = bitacora.slice(-40);
    try { localStorage.setItem(CLAVE_BIT, JSON.stringify(bitacora)); } catch (er) { /* sin localStorage: queda en memoria */ }
  }
  const avisar = () => { try { C.alCambiar(); } catch (e) { /* la interfaz no debe romper el guardado */ } };

  function aceptarVacio() { const d = C.documento(); vacioAceptado = d && C.estaVacio(d) ? C.firma(d) : null; }
  const vacioIntencional = (d) => vacioAceptado !== null && C.firma(d) === vacioAceptado;

  function parsear(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error("el archivo está incompleto o dañado: no es un JSON válido"); }
  }

  /* ── IndexedDB: documentos · respaldos · meta · fotos ── */
  let dbP = null;
  function db() {
    if (!dbP) {
      dbP = new Promise((res, rej) => {
        try {
          if (typeof indexedDB === "undefined" || !indexedDB) { rej(new Error("IndexedDB no disponible")); return; }
          const r = indexedDB.open(C.base, 1);
          r.onupgradeneeded = () => { for (const s of ["documentos", "respaldos", "meta", "fotos"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error || new Error("no se pudo abrir IndexedDB"));
          r.onblocked = () => rej(new Error("base bloqueada"));
        } catch (e) { rej(e); }
      });
      dbP.catch(() => { dbP = null; });
    }
    return dbP;
  }
  /* Lanzan si fallan: quien llama decide, y nunca convierte un fallo en escritura. */
  async function leer(almacen, k) {
    const d = await db();
    return new Promise((res, rej) => {
      try { const q = d.transaction(almacen).objectStore(almacen).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
      catch (e) { rej(e); }
    });
  }
  async function escribir(almacen, k, v) {
    const d = await db();
    return new Promise((res, rej) => {
      try {
        const t = d.transaction(almacen, "readwrite");
        t.objectStore(almacen).put(v, k);
        t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error || new Error("escritura abortada"));
      } catch (e) { rej(e); }
    });
  }
  async function borrar(almacen, k) {
    const d = await db();
    return new Promise((res, rej) => {
      try {
        const t = d.transaction(almacen, "readwrite");
        t.objectStore(almacen).delete(k);
        t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  }
  async function todas(almacen) {
    const d = await db();
    return new Promise((res, rej) => {
      try {
        const st = d.transaction(almacen).objectStore(almacen), ks = st.getAllKeys(), vs = st.getAll();
        vs.onsuccess = () => res(ks.result.map((k, i) => [k, vs.result[i]])); vs.onerror = () => rej(vs.error);
      } catch (e) { rej(e); }
    });
  }

  /* ── diario síncrono (localStorage, clave propia de la app) ──────────────
     IndexedDB es asíncrono: si el sistema mata la pestaña justo después de un
     toque, lo último no alcanza a escribirse. Cada cambio deja además una
     copia SÍNCRONA aquí; se borra cuando IndexedDB confirma, y al arrancar
     se recupera si es más nueva que la copia. Si no cabe, se ignora. */
  const K_DIARIO = C.base + ":diario";
  let secuencia = 0;
  function escribirDiario() {
    try { const d = C.documento(); if (d) localStorage.setItem(K_DIARIO, JSON.stringify({ ts: Date.now(), seq: ++secuencia, txt: JSON.stringify(d) })); }
    catch (e) { /* sin localStorage o sin espacio: queda IndexedDB */ }
  }
  function borrarDiario(hasta) {
    try {
      const j = JSON.parse(localStorage.getItem(K_DIARIO) || "null");
      if (j && (hasta == null || j.seq <= hasta)) localStorage.removeItem(K_DIARIO);
    } catch (e) {}
  }
  function leerDiario() {
    try {
      const j = JSON.parse(localStorage.getItem(K_DIARIO) || "null");
      if (!j || typeof j.txt !== "string") return null;
      const d = JSON.parse(j.txt);
      if (!C.validar(d).ok) return null;
      return { ts: j.ts || 0, doc: C.migrar(d) };
    } catch (e) { return null; }
  }

  /* ── copia del teléfono: «vacía» e «ilegible» son respuestas distintas ── */
  async function leerCopia() {
    let reg;
    try { reg = await leer("documentos", K); }
    catch (e) { return { estado: "ilegible", crudo: null, motivo: "No se pudo leer el almacenamiento del navegador." }; }
    if (!reg) return { estado: "vacia" };
    const crudo = typeof reg.txt === "string" ? reg.txt : null;
    let d;
    try { d = JSON.parse(crudo); } catch (e) { d = undefined; }
    if (!d) return { estado: "ilegible", crudo, motivo: "El contenido guardado está dañado." };
    const v = C.validar(d);
    if (!v.ok) return { estado: "ilegible", crudo, motivo: v.mensaje };
    try { return { estado: "ok", doc: C.migrar(d), ts: reg.ts || 0 }; } catch (e) { return { estado: "ilegible", crudo, motivo: e.message }; }
  }
  function pausarPorIlegible(copia) {
    ilegible = { crudo: copia.crudo, motivo: copia.motivo };
    clearTimeout(tLocal);
    avisar();
  }

  /* ── GUARDA 1 (piso del teléfono) y GUARDA 2 en la copia local ── */
  async function guardarLocal() {
    if (perdioTurno || ilegible) return false;
    const d = C.documento();
    if (!d) return false;
    const previa = await leerCopia();
    if (previa.estado === "ilegible") { pausarPorIlegible(previa); return false; }
    if (C.estaVacio(d) && !vacioIntencional(d) && previa.estado === "ok" && !C.estaVacio(previa.doc)) {
      errorLocal = "protegida";
      C.aviso("Se protegió la copia guardada",
        "Este teléfono ya tiene <b>" + esc(C.resumen(previa.doc)) + "</b> y lo que hay en pantalla está vacío. No se escribió nada.");
      avisar();
      return false;
    }
    try {
      if (previa.estado === "ok") await respaldar(previa.doc, false);
      d.guardado_en = Date.now();
      const seqEscrita = secuencia;
      await escribir("documentos", K, { txt: JSON.stringify(d), ts: Date.now() });
      borrarDiario(seqEscrita);
      if (errorLocal === "fallo") anotar("la copia del teléfono volvió a escribirse bien");
      errorLocal = null; almacenamientoOk = true;
      sucio = false;
      ultimo = { ts: Date.now(), destino: "telefono" };
      return true;
    } catch (e) {
      if (errorLocal !== "fallo") anotar("fallo al escribir la copia del teléfono", e);
      errorLocal = "fallo"; avisar();
      return false;
    }
  }

  /* ── respaldo rotativo: la versión anterior a la escritura, a lo más una
     cada `intervaloRespaldo` (si no, las 3 ranuras cubrirían 3 toques
     seguidos y no tiempo real); `forzar` antes de reemplazar todo. ── */
  async function respaldar(doc, forzar) {
    if (!doc || C.estaVacio(doc)) return false;
    if (!forzar && Date.now() - ultimoRespaldoTs < C.intervaloRespaldo) return false;
    try {
      const lista = (await leer("respaldos", K)) || [];
      const txt = C.firma(doc);
      if (lista[0] && lista[0].txt === txt) { ultimoRespaldoTs = Date.now(); return false; }
      lista.unshift({ ts: Date.now(), resumen: C.resumen(doc), txt });
      while (lista.length > C.maxRespaldos) lista.pop();
      await escribir("respaldos", K, lista);
      ultimoRespaldoTs = Date.now();
      return true;
    } catch (e) { return false; }   // el respaldo nunca impide guardar
  }
  async function respaldos() {
    try { return ((await leer("respaldos", K)) || []).map((r, i) => ({ i, ts: r.ts, resumen: r.resumen })); } catch (e) { return []; }
  }
  async function textoRespaldo(i) {
    try { const l = (await leer("respaldos", K)) || []; return l[i] ? l[i].txt : null; } catch (e) { return null; }
  }
  async function restaurarRespaldo(i) {
    let lista;
    try { lista = (await leer("respaldos", K)) || []; } catch (e) { return { ok: false, motivo: "ilegible" }; }
    if (!lista[i]) return { ok: false, motivo: "no-existe" };
    let r;
    try { r = JSON.parse(lista[i].txt); const v = C.validar(r); if (!v.ok) throw new Error(v.mensaje); r = C.migrar(r); }
    catch (e) { return { ok: false, motivo: "ilegible" }; }
    const actual = C.documento();
    if (actual) await respaldar(actual, true);   // lo de ahora también queda recuperable
    C.cargarDocumento(r);
    aceptarVacio();
    const ok = await guardarAhora();
    avisar();
    return { ok };
  }

  /* ── respaldo externo: solo cuentan los compartidos y las descargas que salieron bien ── */
  async function marcarRespaldoExterno() {
    ultimoExterno = Date.now();
    try { await escribir("meta", "ultimo_respaldo", ultimoExterno); } catch (e) { anotar("no se pudo anotar la fecha del respaldo", e); }
  }
  async function leerUltimoRespaldo() { try { return (await leer("meta", "ultimo_respaldo")) || null; } catch (e) { return null; } }

  /* ── migración: versiones anteriores podían conectar un archivo .json (File System
     Access). Si quedó recordado (meta "archivo") o su huella ("huella_archivo"), se
     olvidan SIN tocar el documento, que ya está completo aquí, y se avisa una vez.
     La fecha de la última escritura al archivo ya está en meta "ultimo_respaldo" y
     se conserva: no dispara el aviso de respaldo de inmediato.
     Orden: primero la marca del aviso, después el borrado; si algo falla a mitad,
     al próximo arranque se reintenta y el aviso igual sale. ── */
  async function migrarArchivoConectado() {
    try { migracion = (await leer("meta", "migracion_archivo")) || null; } catch (e) { migracion = null; }
    let handle = null, huella = null;
    try { handle = await leer("meta", "archivo"); } catch (e) { handle = null; }
    try { huella = await leer("meta", "huella_archivo"); } catch (e) { huella = null; }
    if (!handle && !huella) return;
    try {
      if (!migracion) { migracion = { ts: Date.now(), avisado: false }; await escribir("meta", "migracion_archivo", migracion); }
      await borrar("meta", "archivo");
      await borrar("meta", "huella_archivo");
      anotar("migración: se olvidó el archivo .json conectado (el documento no se tocó)");
    } catch (e) { anotar("migración: no se pudo olvidar el archivo conectado", e); }
  }
  async function marcarMigracionAvisada() {
    if (!migracion || migracion.avisado) return;
    migracion = Object.assign({}, migracion, { avisado: true, avisado_en: Date.now() });
    try { await escribir("meta", "migracion_archivo", migracion); } catch (e) { anotar("migración: no se pudo marcar el aviso", e); }
  }

  async function diagnostico() {
    const r = {
      app: "rutina.html", cuando: new Date().toString(),
      direccion: (location.protocol + "//" + location.host + location.pathname).slice(0, 90),
      origen: location.origin, contextoSeguro: !!window.isSecureContext, navegador: navigator.userAgent,
      webLocks: !!navigator.locks, indexedDB: almacenamientoOk,
      persistente: null, cuotaMB: null, usoMB: null,
      compartirArchivos: puedeCompartirArchivos(),
      estado: estadoGuardado().texto, cambiosSinGuardar: sucio, soloLectura: perdioTurno, copiaIlegible: !!ilegible,
      ultimoGuardado: ultimo.ts ? new Date(ultimo.ts).toLocaleString("es") + " → " + ultimo.destino : null,
      ultimoRespaldo: ultimoExterno ? new Date(ultimoExterno).toLocaleString("es") : "nunca",
      migracionArchivo: migracion ? { cuando: new Date(migracion.ts).toLocaleString("es"), avisado: !!migracion.avisado } : null,
      bitacora: bitacora.slice(-25).map((x) => new Date(x.t).toLocaleString("es") + " · " + x.ev + (x.err ? " · " + x.err : ""))
    };
    try {
      if (navigator.storage && navigator.storage.persisted) r.persistente = await navigator.storage.persisted();
      if (navigator.storage && navigator.storage.estimate) { const est = await navigator.storage.estimate(); r.cuotaMB = Math.round((est.quota || 0) / 1048576); r.usoMB = Math.round((est.usage || 0) / 104857.6) / 10; }
    } catch (e) { /* sin datos de almacenamiento */ }
    return r;
  }

  /* Autoguardado con debounce. Llamarlo en cada cambio. */
  function tocar() {
    if (perdioTurno) return;
    sucio = true;
    if (!ilegible) escribirDiario();
    avisar();
    if (ilegible) return;
    clearTimeout(tLocal);
    tLocal = setTimeout(async () => { await guardarLocal(); avisar(); }, C.debounce);
  }
  async function guardarAhora() {
    clearTimeout(tLocal);
    const ok = await guardarLocal();
    avisar();
    return ok;
  }

  /* Reemplazar el documento en pantalla por otro: lo de ahora queda en respaldos. */
  async function reemplazarPor(d) {
    const actual = C.documento();
    if (actual) await respaldar(actual, true);
    C.cargarDocumento(d);
  }

  /* ── guardar respaldo (exportar) y restaurar (importar): siempre disponibles ── */
  function puedeCompartirArchivos() {
    try {
      if (typeof navigator === "undefined" || typeof navigator.share !== "function" || typeof navigator.canShare !== "function" || typeof File !== "function") return false;
      return !!navigator.canShare({ files: [new File(["{}"], "prueba.json", { type: "application/json" })] });
    } catch (e) { return false; }
  }
  async function documentoExportable() {
    const d = C.documento();
    if (!d) return null;
    const out = JSON.parse(JSON.stringify(d));
    out.exportado_en = Date.now();
    out.fotos = {};
    try {
      for (const [k, blob] of await todas("fotos")) if (blob) out.fotos[k] = await blobADataUrl(blob);
    } catch (e) { /* sin fotos: el resto se exporta igual */ }
    return out;
  }
  /* compartir = true: menú Compartir del teléfono (Drive, Archivos, iCloud…) si acepta archivos;
     si no, descarga. Cerrar el menú no es error ni cuenta como respaldo. */
  async function exportar(compartir) {
    const d = await documentoExportable();
    if (!d) return { ok: false };
    const nombre = C.nombreArchivo(true), texto = JSON.stringify(d, null, 1);
    if (compartir && puedeCompartirArchivos()) {
      let f = null;
      try { f = new File([texto], nombre, { type: "application/json" }); } catch (e) { f = null; }
      if (f && navigator.canShare({ files: [f] })) {
        try {
          await navigator.share({ files: [f], title: "Respaldo de Rutina" });
          await marcarRespaldoExterno(); ultimo = { ts: Date.now(), destino: "compartido" }; avisar();
          return { ok: true, via: "compartir" };
        } catch (e) {
          if (e && e.name === "AbortError") return { ok: false, motivo: "cancelado" };
          anotar("compartir respaldo falló; se descarga", e);
        }
      }
    }
    C.descargarTexto(nombre, texto);
    await marcarRespaldoExterno(); ultimo = { ts: Date.now(), destino: "descarga" }; avisar();
    return { ok: true, via: "descarga" };
  }
  /* GUARDA 1 en importar: si no se puede leer, no cambia nada. Acepta los respaldos
     exportados (con fotos) y los .json que escribía la versión con archivo conectado:
     es el mismo documento. */
  async function importar(file) {
    if (perdioTurno) return { ok: false, motivo: "solo-lectura" };
    let d = null, motivo = "";
    try {
      d = parsear(await file.text());
      const v = C.validar(d);
      if (!v.ok) throw new Error(v.mensaje);
    } catch (e) { d = null; motivo = e.message; }
    if (!d) {
      anotar("restaurar: no se pudo leer el archivo · " + motivo);
      C.aviso("No se restauró el respaldo", "No se pudo leer <b>" + esc(file.name) + "</b> (" + esc(motivo) + "). No se cambió nada.");
      return { ok: false, motivo: "ilegible" };
    }
    const fotos = d.fotos && typeof d.fotos === "object" ? d.fotos : {};
    let doc;
    try { doc = C.migrar(d); delete doc.fotos; delete doc.exportado_en; }
    catch (e) { C.aviso("No se restauró el respaldo", "El contenido no se pudo interpretar (" + esc(e.message) + "). No se cambió nada."); return { ok: false }; }
    if (ilegible) {
      const r = await C.preguntar("Reemplazar la copia dañada", "La copia de este teléfono no se puede leer. Se descargará su texto crudo y se reemplazará por <b>" + esc(C.resumen(doc)) + "</b>.",
        [{ valor: "si", texto: "Descargar y reemplazar", tono: "prim" }, { valor: null, texto: "Cancelar" }]);
      if (!r) return { ok: false, motivo: "cancelado" };
      rescatarIlegible();
      if (!await liberarIlegible()) return { ok: false, motivo: "no-se-pudo" };
    } else {
      const actual = C.documento();
      if (actual && !C.estaVacio(actual) && C.firma(actual) !== C.firma(doc)) {
        const r = await C.preguntar("¿Reemplazar lo de este teléfono?", "El respaldo tiene <b>" + esc(C.resumen(doc)) + "</b>.<br>Este teléfono tiene <b>" + esc(C.resumen(actual)) +
          "</b>.<br><br>Lo de ahora queda en los respaldos internos (Ajustes → Guardado), así que se puede volver.", [{ valor: "si", texto: "Reemplazar con el respaldo", tono: "prim" }, { valor: null, texto: "Cancelar" }]);
        if (!r) return { ok: false, motivo: "cancelado" };
      }
    }
    await reemplazarPor(doc);
    let nFotos = 0;
    for (const k of Object.keys(fotos)) {
      try { const b = dataUrlABlob(fotos[k]); if (b) { await escribir("fotos", k, b); nFotos++; } } catch (e) { /* una foto mala no frena el resto */ }
    }
    aceptarVacio();
    const ok = await guardarAhora();
    anotar("restaurar: respaldo cargado" + (nFotos ? " con " + nFotos + " fotos" : ""));
    avisar();
    return { ok, fotos: nFotos };
  }

  /* ── copia ilegible ── */
  function rescatarIlegible() {
    if (!ilegible) return false;
