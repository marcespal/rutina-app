<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<title>Rutina</title>
<script>
/* Solo servida por http(s) (GitHub Pages, localhost): manifest e íconos para instalarla.
   Abierta desde Archivos (content://, file://) o dentro de una demo (about:srcdoc) no se agrega nada. */
if (/^https?:$/.test(location.protocol)) {
  for (const [rel, href, extra] of [["manifest", "manifest.webmanifest"], ["icon", "icono.svg", "image/svg+xml"], ["apple-touch-icon", "icono-apple.png"]]) {
    const l = document.createElement("link"); l.rel = rel; l.href = href; if (extra) l.type = extra; document.head.appendChild(l);
  }
}
</script>
<!--
  Rutina · registro de gimnasio en un solo archivo HTML.
  Sin dependencias, sin internet. Todo vive en este teléfono (IndexedDB) y,
  si se conecta, en un archivo .json. Copia local de la sección «Gym».
-->
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --track:#ECEBE7; --ink:#1B1C1E; --muted:#5C6066; --ghost:#8A8E94;
  --line:#E2E2DE; --dash:#B9BBB6; --accent:#2E5E74; --on-accent:#FFFFFF; --soft:#E3ECF0; --cal-bg:#F7F7F5;
  --warn-ink:#7A4F0E; --warn-bg:#F4EEE2; --ok-ink:#2F6B3F; --ok-bg:#E4F0E6; --danger:#A33A2A; --danger-bg:#F6E7E4;
  --l0:#F1F1EE; --l1:#D9E6EC; --l2:#9DBDCB; --l3:#2E5E74; --l3-ink:#FFFFFF;
  --band:#E3ECF0; --band-line:#B9CFD9; --bajo:#9DBDCB; --sobre:#7A4F0E;
  --sombra:0 1px 2px rgba(0,0,0,.12); --velo:rgba(0,0,0,.38);
  --mapa-piel:#E3E8EB; --mapa-borde:#C3CCD2; --mapa-base:#AEB9C0; --mapa-pelo:#8F9CA4; --mapa-n0:#A9CADA; --mapa-n1:#4F8AA6; --mapa-n2:#1F4A5E;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111213; --surface:#1A1B1D; --track:#24262A; --ink:#ECECEA; --muted:#A2A6AB; --ghost:#71767C;
    --line:#2C2E31; --dash:#4A4D52; --accent:#8FBACD; --on-accent:#0F1A20; --soft:#1F2C33; --cal-bg:#16171A;
    --warn-ink:#E3BC7A; --warn-bg:#2B2419; --ok-ink:#8CC79A; --ok-bg:#1D2A20; --danger:#E89A8C; --danger-bg:#2E1D1A;
    --l0:#1F2023; --l1:#1F2C33; --l2:#35596A; --l3:#8FBACD; --l3-ink:#0F1A20;
    --band:#24323A; --band-line:#3D5561; --bajo:#4C6E7E; --sobre:#E3BC7A;
    --sombra:none; --velo:rgba(0,0,0,.6);
    --mapa-piel:#3A4A53; --mapa-borde:#556873; --mapa-base:#24343D; --mapa-pelo:#18242B; --mapa-n0:#F6C28B; --mapa-n1:#F08A4B; --mapa-n2:#E4572E;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}
.tenue{color:var(--muted)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.vista{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;
  overscroll-behavior:contain}
.vista>*{flex-shrink:0}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cab .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cab h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.cab .fecha{font-size:13px;color:var(--muted)}
h2{margin:0;font-size:17px;font-weight:600}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.fila{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.entre{justify-content:space-between}
.pequeno{font-size:13px}
.mini{font-size:12px}

/* botones */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.grande{height:56px;font-size:18px;border-radius:14px;width:100%}
.btn.ancho{width:100%}
.btn.texto{border:0;background:transparent;color:var(--accent);padding:0 8px}
.btn.peligro{color:var(--danger);border-color:var(--line)}
.btn.peligro.lleno{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.punteado{border:1px dashed var(--dash);background:transparent;font-weight:500}
.icono{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:0 0 auto;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips.envolver{flex-wrap:wrap;overflow:visible}
.chips.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}
.chips.dias .chip{padding:0;min-width:0}

/* píldora de guardado */
.pildora{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);flex:0 0 auto;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pildora .punto{width:8px;height:8px;border-radius:4px;background:currentColor;flex:0 0 auto}
.pildora.ok{color:var(--ok-ink);background:var(--ok-bg);border-color:transparent}
.pildora.aviso{color:var(--warn-ink);background:var(--warn-bg);border-color:transparent}
.pildora.local{color:var(--muted)}
.pildora.boton{min-height:44px}
.pildora.compacta{min-height:44px;border-radius:22px;padding:0 10px;font-size:12px;max-width:100%}
.ses-cab>.col{flex:1 1 auto}

/* avisos en línea */
.nota{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);align-items:flex-start}
.nota .cuerpo{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.nota b{font-weight:600}
.nota.suave{background:var(--soft);color:var(--ink)}
.nota.peligro{background:var(--danger-bg);color:var(--danger)}
.nota .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nota .btn{min-height:44px}

/* inicio */
.dias{display:flex;align-items:center;gap:16px}
.dias .grande{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.03em}
.dias .sep{display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-sem{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cal-dia{height:44px;border-radius:10px;border:0;padding:0;font-size:13px;font-weight:500;background:var(--l0);color:var(--ink)}
.cal-dia.n1{background:var(--l1)} .cal-dia.n2{background:var(--l2)} .cal-dia.n3{background:var(--l3);color:var(--l3-ink)}
.cal-dia.futuro{background:transparent;color:var(--muted)}
.cal-dia.hoy{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.cal-dia[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.leyenda{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.leyenda i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* nav inferior */
.nav{flex:0 0 auto;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;min-height:44px;padding:0}
.nav button span.p{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button[aria-current="page"] span.p{background:var(--soft)}

/* sesión */
.ses-cab{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.ses-cab h1{margin:0;font-size:21px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-cab .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ej-cerrado{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ej-cerrado>button.abrir{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;border:0;background:transparent;text-align:left;padding:0}
.bola{flex:0 0 auto;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--muted);font-size:13px;font-weight:700}
.bola.lista{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ej-nom{font-size:16px;font-weight:600;display:block}
.ej-res{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ej-abierto{display:flex;flex-direction:column;gap:10px;padding:12px 12px 10px;border-radius:18px;background:var(--surface);border:1.5px solid var(--accent)}
.ej-abierto h2{font-size:19px;line-height:1.2;font-weight:700}
.miniatura{flex:0 0 auto;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--track);display:flex;align-items:center;justify-content:center;color:var(--muted);border:0;padding:0}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block}
.sug{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--ink)}
.sug.descarga{background:var(--warn-bg);color:var(--warn-ink)}
.sug .tag{font-size:11px;font-weight:700;letter-spacing:.04em}
.encabezado-series{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.serie{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:0 -12px;padding:0 12px}
.serie.cal{background:var(--cal-bg)}
.serie .r{display:flex;align-items:center;gap:6px;min-height:66px}
.serie .n{flex:0 0 auto;width:36px;height:44px;border:0;border-radius:8px;padding:0;background:transparent;font-size:15px;font-weight:700}
.serie.cal .n{background:var(--track);color:var(--muted)}
.celda{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:10px;background:transparent;display:flex;align-items:baseline;gap:3px;line-height:52px;padding:0 6px}
.celda.peso{justify-content:flex-end}
.celda .v{font-size:25px;font-weight:500;letter-spacing:-.01em}
.serie.cal .celda .v{font-size:19px}
.celda .u{font-size:13px;color:var(--muted)}
.celda.fantasma{color:var(--ghost)}
.celda.hecha .v{font-weight:700}
.celda.vacia{border:1.5px dashed var(--dash);color:var(--muted)}
.celda.vacia .v{font-size:15px}
.por{flex:0 0 auto;width:12px;text-align:center;color:var(--muted)}
.rir{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;padding:0;color:var(--muted)}
.rir.con{color:var(--ink)}
.ok:not(.pildora){flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.ok[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ok.vacio{border-color:var(--dash);color:var(--dash)}
.editor{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:var(--track)}
.editor .pm{flex:0 0 auto;width:52px;height:52px;border:0;border-radius:11px;background:var(--surface);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;padding:0}
.editor .centro{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center}
.editor input{width:100%;min-width:0;height:34px;border:0;background:transparent;text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.editor input:focus{outline:2px solid var(--accent);border-radius:8px}
.editor .et{font-size:11px;color:var(--muted)}
.rir-chips{display:flex;flex-direction:column;gap:6px;padding:0 0 12px 36px}
.rir-chips .g{display:flex;gap:6px}
.rir-chips button{flex:1 1 0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;padding:0}
.rir-chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.papelera-fila{flex:0 0 auto}
.descanso{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.descanso .barra{position:absolute;top:-1px;left:0;height:3px;background:var(--accent)}
.descanso .t{font-size:30px;line-height:1.05;font-weight:700}
.descanso.fin{background:var(--soft)}

/* listas */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lista>.it{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.lista>.it:first-child{border-top:0}
.lista .it .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.lista .it .txt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .it .txt span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.pestanas{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.pestanas button{flex:1 1 0;height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted)}
.pestanas button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra)}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.entrada{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.entrada{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
select.entrada{appearance:auto}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:12px;color:var(--muted);font-weight:400}
.error{font-size:13px;color:var(--danger);font-weight:600}
.paso{display:flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.paso button{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:10px;background:var(--surface);box-shadow:var(--sombra);font-size:20px;font-weight:600;padding:0}
.paso span{flex:1 1 auto;text-align:center;font-weight:700;font-size:18px}

/* gráficos */
svg.graf{width:100%;height:auto;display:block}
svg.graf text{fill:var(--muted);font-size:10px;font-family:inherit}
.vol{display:flex;align-items:center;gap:8px;height:30px}
.vol .g{width:84px;font-size:14px;font-weight:500;flex:0 0 auto}
.vol .pista{position:relative;flex:1 1 auto;height:28px;border-radius:6px;background:var(--track)}
.vol .banda{position:absolute;top:0;bottom:0;left:41.67%;width:41.66%;background:var(--band);border-left:1px solid var(--band-line);border-right:1px solid var(--band-line)}
.vol .b{position:absolute;top:7px;height:14px;left:0;border-radius:0 7px 7px 0}
.vol .v{width:30px;text-align:right;font-size:16px;font-weight:700;flex:0 0 auto}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cifra{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.cifra .k{font-size:12px;font-weight:600;color:var(--muted)}
.cifra .v{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra .v small{font-size:13px;font-weight:500;color:var(--muted)}
.marca{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--track);color:var(--muted);white-space:nowrap}
.marca.record{background:var(--warn-bg);color:var(--warn-ink)}
.marca.mas{background:var(--soft);color:var(--accent)}
.semana-dots{display:flex;gap:6px}
.semana-dots span{flex:1 1 0;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--l0);color:var(--muted)}
.semana-dots span.habitual{box-shadow:inset 0 0 0 1px var(--dash)}
.semana-dots span.hecho{background:var(--accent);color:var(--on-accent);box-shadow:none}
.semana-dots span.esta{outline:2px solid var(--ink);outline-offset:1px}

/* capas */
.velo{position:fixed;inset:0;background:var(--velo);display:flex;flex-direction:column;justify-content:flex-end;z-index:50}
.velo.centro{justify-content:center;padding:16px}
.hoja{background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;max-width:560px;width:100%;margin:0 auto}
.hoja .asa{align-self:center;width:36px;height:4px;border-radius:2px;background:var(--line)}
.dialogo{background:var(--bg);border-radius:20px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto;max-height:86vh;overflow-y:auto}
.dialogo h2{font-size:19px;font-weight:700}
.dialogo .cuerpo{font-size:15px;line-height:1.45}
.dialogo .botones{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opcion{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.opcion.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opcion .txt{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.opcion .txt small{font-size:13px;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;min-height:36px}
.bloqueo{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.mapa-figs{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.mapa-figs svg{height:270px;width:auto;max-width:48%;display:block}

/* ── fechas ─────────────────────────────────────────────────────────────

function partesFecha(f) {

/* ── números ────────────────────────────────────────────────────────────

function leerNumero(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  let t = v.trim().replace(/\s/g, "");
  if (!t) return null;
  if (t.indexOf(",") >= 0 && t.indexOf(".") >= 0) {
    t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  } else t = t.replace(",", ".");

  const n = parseFloat(t);

function limitarPeso(v) {

/** − / + del peso: un salto, sin salir de 0–1000. */

/* ── consultas básicas ─────────────────────────────────────────────────── */

/* ── sugerencia de carga: progresión doble y descarga ──────────────────

/* ── constancia: UNA sola función para el número y el aviso ────────────

    if (s.fecha <= hoy && tieneTrabajo(s) && (!ultima || s.fecha > ultima)) ultima = s.fecha;
  }
  const res = { ultimaFecha: ultima, diasCorridos: null, diasSinEntrenar: 0, perdidos: [], aviso: false,

  return { titulo: "Van " + n + (n === 1 ? " día" : " días") + " de entreno sin ir",

    if (s.fecha < lunes || s.fecha > fin) continue;
    for (const x of seriesDe(s)) {
      if (!esEfectiva(x)) continue;
      const e = ejercicioPorId(estado, x.ejercicio_id);
      if (!e) continue;

/* ── calendario (gym.v_dia) ──────────────────────────────────────────── */

/* ── historial y gráfico por ejercicio ───────────────────────────────── */
function historialEjercicio(estado, ejercicioId) {

  if (mismo) return (series[0].peso > 0 ? kg(series[0].peso) : "PC") + " × " + reps;

/* ── resumen que celebra ─────────────────────────────────────────────── */

    const recRM = hayAntes && rmHoy > 0 && rmAntes > 0 && rmHoy > rmAntes;

    if (recRM) records.push({ nombre: e.nombre, tipo: "1rm", hoy: rmHoy, antes: rmAntes });

    calentamiento: todas.length - trabajo.length, kilos: Math.round(volumen(trabajo)), ejercicios: ejercicios, records: records,
    ejerciciosConRecord: nRec, frente: antesFrente > 0 ? { hoy: Math.round(hoyFrente), antes: Math.round(antesFrente) } : null,

  };
}

      try {
        const t = d.transaction(almacen, "readwrite");
        t.objectStore(almacen).delete(k);
        t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  }
  async function todas(almacen) {
    const d = await db();
    return new Promise((res, rej) => {
      try {
        const st = d.transaction(almacen).objectStore(almacen), ks = st.getAllKeys(), vs = st.getAll();
        vs.onsuccess = () => res(ks.result.map((k, i) => [k, vs.result[i]])); vs.onerror = () => rej(vs.error);
      } catch (e) { rej(e); }
    });
  }

  /* ── diario síncrono (localStorage, clave propia de la app) ──────────────
     IndexedDB es asíncrono: si Android mata la pestaña justo después de un
     toque, lo último no alcanza a escribirse. Cada cambio deja además una
     copia SÍNCRONA aquí; se borra cuando IndexedDB confirma, y al arrancar
     se recupera si es más nueva que la copia. Si no cabe, se ignora. */
  const K_DIARIO = C.base + ":diario";
  let secuencia = 0;
  function escribirDiario() {
    try { const d = C.documento(); if (d) localStorage.setItem(K_DIARIO, JSON.stringify({ ts: Date.now(), seq: ++secuencia, txt: JSON.stringify(d) })); }
    catch (e) { /* sin localStorage o sin espacio: queda IndexedDB */ }
  }
  function borrarDiario(hasta) {
    try {
      const j = JSON.parse(localStorage.getItem(K_DIARIO) || "null");
      if (j && (hasta == null || j.seq <= hasta)) localStorage.removeItem(K_DIARIO);
    } catch (e) {}
  }
  function leerDiario() {
    try {
      const j = JSON.parse(localStorage.getItem(K_DIARIO) || "null");
      if (!j || typeof j.txt !== "string") return null;
      const d = JSON.parse(j.txt);
      if (!C.validar(d).ok) return null;
      return { ts: j.ts || 0, doc: C.migrar(d) };
    } catch (e) { return null; }
  }

  /* ── copia del teléfono: «vacía» e «ilegible» son respuestas distintas ── */
  async function leerCopia() {
    let reg;
    try { reg = await leer("documentos", K); }
    catch (e) { return { estado: "ilegible", crudo: null, motivo: "No se pudo leer el almacenamiento del navegador." }; }
    if (!reg) return { estado: "vacia" };
    const crudo = typeof reg.txt === "string" ? reg.txt : null;
    let d;
    try { d = JSON.parse(crudo); } catch (e) { d = undefined; }
    if (!d) return { estado: "ilegible", crudo, motivo: "El contenido guardado está dañado." };
    const v = C.validar(d);
    if (!v.ok) return { estado: "ilegible", crudo, motivo: v.mensaje };
    try { return { estado: "ok", doc: C.migrar(d), ts: reg.ts || 0 }; } catch (e) { return { estado: "ilegible", crudo, motivo: e.message }; }
  }
  function pausarPorIlegible(copia) {
    ilegible = { crudo: copia.crudo, motivo: copia.motivo };
    clearTimeout(tLocal); clearTimeout(tArchivo);
    avisar();
  }

  /* ── GUARDA 1 (piso del teléfono) y GUARDA 2 en la copia local ── */
  async function guardarLocal() {
    if (perdioTurno || ilegible) return false;
    const d = C.documento();
    if (!d) return false;
    const previa = await leerCopia();
    if (previa.estado === "ilegible") { pausarPorIlegible(previa); return false; }
    if (C.estaVacio(d) && !vacioIntencional(d) && previa.estado === "ok" && !C.estaVacio(previa.doc)) {
      errorLocal = "protegida";
      C.aviso("Se protegió la copia guardada",
        "Este teléfono ya tiene <b>" + esc(C.resumen(previa.doc)) + "</b> y lo que hay en pantalla está vacío. No se escribió nada.");
      avisar();
      return false;
    }
    try {
      if (previa.estado === "ok") await respaldar(previa.doc, false);
      d.guardado_en = Date.now();
      const seqEscrita = secuencia;
      await escribir("documentos", K, { txt: JSON.stringify(d), ts: Date.now() });
      borrarDiario(seqEscrita);
      errorLocal = null; almacenamientoOk = true;
      if (!archivo) sucio = false;
      ultimo = { ts: Date.now(), destino: "telefono" };
      return true;
    } catch (e) {
      errorLocal = "fallo"; avisar();
      return false;
    }
  }

  /* ── respaldo rotativo: la versión anterior a la escritura, a lo más una
     cada `intervaloRespaldo` (si no, las 3 ranuras cubrirían 3 toques
     seguidos y no tiempo real); `forzar` antes de reemplazar todo. ── */
  async function respaldar(doc, forzar) {
    if (!doc || C.estaVacio(doc)) return false;
    if (!forzar && Date.now() - ultimoRespaldoTs < C.intervaloRespaldo) return false;
    try {
      const lista = (await leer("respaldos", K)) || [];
      const txt = C.firma(doc);
      if (lista[0] && lista[0].txt === txt) { ultimoRespaldoTs = Date.now(); return false; }
      lista.unshift({ ts: Date.now(), resumen: C.resumen(doc), txt });
      while (lista.length > C.maxRespaldos) lista.pop();
      await escribir("respaldos", K, lista);
      ultimoRespaldoTs = Date.now();
      return true;
    } catch (e) { return false; }   // el respaldo nunca impide guardar
  }
  async function respaldos() {
    try { return ((await leer("respaldos", K)) || []).map((r, i) => ({ i, ts: r.ts, resumen: r.resumen })); } catch (e) { return []; }
  }
  async function textoRespaldo(i) {
    try { const l = (await leer("respaldos", K)) || []; return l[i] ? l[i].txt : null; } catch (e) { return null; }
  }
  async function restaurarRespaldo(i) {
    let lista;
    try { lista = (await leer("respaldos", K)) || []; } catch (e) { return { ok: false, motivo: "ilegible" }; }
    if (!lista[i]) return { ok: false, motivo: "no-existe" };
    let r;
    try { r = JSON.parse(lista[i].txt); const v = C.validar(r); if (!v.ok) throw new Error(v.mensaje); r = C.migrar(r); }
    catch (e) { return { ok: false, motivo: "ilegible" }; }
    const actual = C.documento();
    if (actual) await respaldar(actual, true);   // lo de ahora también queda recuperable
    C.cargarDocumento(r);
    aceptarVacio();
    const ok = await guardarAhora();
    avisar();
    return { ok };
  }

  /* ── archivo vinculado (File System Access API) ── */
  const hayApiArchivos = () => typeof window !== "undefined" && typeof window.showOpenFilePicker === "function" && typeof window.showSaveFilePicker === "function";
  async function leerJSONde(h) {
    const f = await h.getFile();
    const t = await f.text();
    if (!t.trim()) return null;
    const d = parsear(t);
    const v = C.validar(d);
    if (!v.ok) throw new Error(v.mensaje);
    return C.migrar(d);
  }
  async function permisoEscritura(h, pedir) {
    try {
      const q = await h.queryPermission({ mode: "readwrite" });
      if (q === "granted") return true;
      if (!pedir) { anotar("permiso al consultar: " + q); return false; }
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") anotar("permiso al pedir: " + p);
      return p === "granted";
    } catch (e) { anotar("error al pedir permiso", e); return false; }
  }
  async function recordarArchivo(h) {
    try { await escribir("meta", "archivo", h); anotar("archivo recordado para la próxima apertura"); }
    catch (e) { anotar("no se pudo recordar el archivo (no habrá Reconectar al volver)", e); }
  }
  async function olvidarArchivo() { try { await borrar("meta", "archivo"); } catch (e) {} }
  /* Solo cuentan como respaldo las escrituras al archivo y las exportaciones. */
  async function marcarRespaldoExterno() { try { await escribir("meta", "ultimo_respaldo", Date.now()); } catch (e) {} }
  async function ultimoRespaldoExterno() { try { return (await leer("meta", "ultimo_respaldo")) || null; } catch (e) { return null; } }
  /* Huella del último contenido que el archivo tuvo según esta app (escrito o leído).
     Al reconectar, si el archivo sigue con esa huella, nadie lo cambió por fuera:
     lo local es lo más nuevo y se escribe sin preguntar. Si no, se pregunta. */
  function huella(d) {
    let t; try { t = C.firma(C.migrar(d)); } catch (e) { t = C.firma(d); }   // misma forma al escribir y al leer
    let h = 0x811c9dc5;
    for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return t.length + ":" + h.toString(16);
  }
  async function anotarHuella(d) { try { await escribir("meta", "huella_archivo", d ? huella(d) : null); } catch (e) {} }
  async function huellaAnotada() { try { return (await leer("meta", "huella_archivo")) || null; } catch (e) { return null; } }

  /* GUARDA 2 · nunca escribir vacío sobre contenido. */
  async function guardarArchivo() {
    if (!archivo || perdioTurno || ilegible) return false;
    const d = C.documento();
    if (!d) return false;
    if (C.estaVacio(d) && !vacioIntencional(d)) {
      let previo = null, fallo = false;
      try { previo = await leerJSONde(archivo); } catch (e) { fallo = true; }
      if (fallo) {
        errorArchivo = "No se pudo leer el archivo";
        C.aviso("No se escribió el archivo", "No se pudo leer <b>" + esc(archivo.name) + "</b> y en pantalla no hay datos, así que no se escribió nada. El archivo quedó intacto.");
        avisar(); return false;
      }
      if (previo && !C.estaVacio(previo)) {
        const nom = archivo.name;
        archivo = null; await olvidarArchivo();       // desvincular: si no, el aviso se repite sin fin
        C.aviso("Se protegió tu archivo", "<b>" + esc(nom) + "</b> contiene " + esc(C.resumen(previo)) +
          " y esta pantalla está vacía. No se escribió nada y se desconectó el archivo.<br><br>Ábrelo de nuevo desde Ajustes para cargar sus datos.");
        avisar(); return false;
      }
    }
    let paso = "abrir el archivo para escribir";
    try {
      const texto = JSON.stringify(d, null, 1);
      const w = await archivo.createWritable();
      paso = "escribir"; await w.write(texto);
      paso = "cerrar el archivo"; await w.close();
      /* Comprobar que lo escrito quedó: hay teléfonos que aceptan la escritura
         y dejan el archivo como estaba. */
      paso = "comprobar lo escrito";
      const esperado = new Blob([texto]).size;
      const tam = (await archivo.getFile()).size;
      if (tam !== esperado) throw new Error("el archivo quedó con " + tam + " bytes y se escribieron " + esperado);
      escriturasArchivo += 1;
      if (errorArchivo) anotar("el archivo volvió a escribirse bien");
      else if (escriturasArchivo === 1) anotar("primera escritura de esta apertura: ok (" + esperado + " bytes)");
      sucio = false; errorArchivo = null; ultimoErrorArchivo = null;
      ultimo = { ts: Date.now(), destino: "archivo" };
      await marcarRespaldoExterno();
      await anotarHuella(d);
      avisar();
      return true;
    } catch (e) {
      const primera = !errorArchivo;
      errorArchivo = "No se pudo escribir el archivo";
      ultimoErrorArchivo = { cuando: new Date().toLocaleString("es"), paso: paso, detalle: detalleError(e) };
      anotar("fallo al " + paso, e);
      if (primera) C.aviso("No se pudo escribir el archivo",
        "Falló al <b>" + esc(paso) + "</b>: " + esc(detalleError(e)) + ".<br><br>Lo anotado sigue guardado en este teléfono. " +
        "En Ajustes toca <b>Exportar respaldo</b> para tener una copia, y <b>Diagnóstico</b> para copiar el detalle.");
      avisar(); return false;
    }
  }
  /* Escribir ya y comprobar (botón «Probar el archivo»). */
  async function probarArchivo() {
    if (!archivo) return { ok: false, motivo: archivoPendiente ? "pendiente" : "sin-archivo" };
    clearTimeout(tArchivo);
    errorArchivo = null;                 // que un fallo vuelva a mostrar su aviso
    await guardarLocal();
    return { ok: await guardarArchivo() };
  }
  async function diagnostico() {
    const r = {
      app: "rutina.html", cuando: new Date().toString(),
      direccion: (location.protocol + "//" + location.host + location.pathname).slice(0, 90),
      origen: location.origin, contextoSeguro: !!window.isSecureContext, navegador: navigator.userAgent,
      apiArchivos: hayApiArchivos(), webLocks: !!navigator.locks, indexedDB: almacenamientoOk,
      persistente: null, cuotaMB: null,
      archivo: archivo ? "conectado" : archivoPendiente ? "pendiente de reconectar" : "ninguno",
      permiso: null, tamanoArchivoBytes: null,
      estado: estadoGuardado().texto, cambiosSinGuardar: sucio, soloLectura: perdioTurno, copiaIlegible: !!ilegible,
      escriturasEnEstaApertura: escriturasArchivo,
      ultimoGuardado: ultimo.ts ? new Date(ultimo.ts).toLocaleString("es") + " → " + ultimo.destino : null,
      ultimoErrorArchivo: ultimoErrorArchivo,
      bitacora: bitacora.slice(-25).map((x) => new Date(x.t).toLocaleString("es") + " · " + x.ev + (x.err ? " · " + x.err : ""))
    };
    try {
      if (navigator.storage && navigator.storage.persisted) r.persistente = await navigator.storage.persisted();
      if (navigator.storage && navigator.storage.estimate) r.cuotaMB = Math.round(((await navigator.storage.estimate()).quota || 0) / 1048576);
    } catch (e) { /* sin datos de almacenamiento */ }
    const h = archivo || archivoPendiente;
    if (h) {
      try { r.permiso = await h.queryPermission({ mode: "readwrite" }); } catch (e) { r.permiso = detalleError(e); }
      try { r.tamanoArchivoBytes = (await h.getFile()).size; } catch (e) { r.tamanoArchivoBytes = detalleError(e); }
    }
    return r;
  }

  /* Autoguardado con debounce. Llamarlo en cada cambio. */
  function tocar() {
    if (perdioTurno) return;
    sucio = true;
    if (!ilegible) escribirDiario();
    avisar();
    if (ilegible) return;
    clearTimeout(tLocal);
    tLocal = setTimeout(async () => {
      const ok = await guardarLocal();
      if (archivo) {
        clearTimeout(tArchivo);
        tArchivo = setTimeout(() => { guardarArchivo(); }, C.debounceArchivo);
      }
      if (ok && !archivo) sucio = false;
      avisar();
    }, C.debounce);
  }
  async function guardarAhora() {
    clearTimeout(tLocal); clearTimeout(tArchivo);
    const ok = await guardarLocal();
    if (archivo) return (await guardarArchivo()) && ok;
    if (ok) sucio = false;
    avisar();
    return ok;
  }

  /* Reemplazar el documento en pantalla por otro: lo de ahora queda en respaldos. */
  async function reemplazarPor(d) {
    const actual = C.documento();
    if (actual) await respaldar(actual, true);
    C.cargarDocumento(d);
  }

  /* Decide con el usuario qué conservar cuando el archivo y el teléfono difieren.
     Devuelve "archivo" | "telefono" | null (cancelado). */
  async function elegirVersion(nombre, enArchivo) {
    const actual = C.documento();
    if (!enArchivo || C.estaVacio(enArchivo)) return "telefono";
    if (!actual || C.estaVacio(actual)) return "archivo";
    if (C.firma(actual) === C.firma(enArchivo)) return "archivo";
    return C.preguntar("¿Qué datos conservas?",
      "<b>" + esc(nombre) + "</b> tiene <b>" + esc(C.resumen(enArchivo)) + "</b>.<br>Este teléfono tiene <b>" + esc(C.resumen(actual)) +
      "</b>.<br><br>Lo que no elijas queda en los respaldos de Ajustes.",
      [{ valor: "archivo", texto: "Usar el archivo", tono: "prim" }, { valor: "telefono", texto: "Usar lo de este teléfono" }, { valor: null, texto: "Cancelar" }]);
  }

  /* GUARDA 1 · abrir un archivo existente. Una lectura fallida nunca termina en escritura. */
  async function vincular() {
    if (perdioTurno) return { ok: false, motivo: "solo-lectura" };
    if (!hayApiArchivos()) return { ok: false, motivo: "sin-api" };
    let h;
    try { [h] = await window.showOpenFilePicker({ types: C.tiposArchivo, multiple: false }); }
    catch (e) { return { ok: false, motivo: "cancelado" }; }
    let d = null, fallo = false, motivo = "";
    try { d = await leerJSONde(h); } catch (e) { fallo = true; motivo = e.message; }
    if (fallo) {
      anotar("abrir existente: no se pudo leer · " + motivo);
      C.aviso("No se conectó el archivo", "No se pudo leer <b>" + esc(h.name) + "</b> (" + esc(motivo) + "). No se conectó ni se escribió nada: su contenido quedó intacto.");
      return { ok: false, motivo: "ilegible" };       // ← salir, no continuar
    }
    const eleccion = await elegirVersion(h.name, d);
    if (!eleccion) return { ok: false, motivo: "cancelado" };
    if (!await permisoEscritura(h, true)) {
      C.aviso("Sin permiso", "El navegador no dio permiso para escribir en <b>" + esc(h.name) + "</b>. No se conectó.");
      return { ok: false, motivo: "sin-permiso" };
    }
    let escribirYa = true;
    if (eleccion === "archivo" && d) {
      await reemplazarPor(d); escribirYa = false;
    } else if (d && !C.estaVacio(d)) {
      await respaldar(d, true);                        // lo del archivo queda recuperable
    }
    archivo = h; archivoPendiente = null; errorArchivo = null;
    await recordarArchivo(h);
    await guardarLocal();
    if (escribirYa) await guardarArchivo(); else { sucio = false; await anotarHuella(d); }
    avisar();
    return { ok: true, cargado: !escribirYa };
  }

  /* Crear un archivo nuevo y conectarlo. */
  async function archivoNuevo() {
    if (perdioTurno) return { ok: false, motivo: "solo-lectura" };
    const doc = C.documento();
    if (!doc) return { ok: false, motivo: "sin-documento" };
    if (!hayApiArchivos()) return { ok: false, motivo: "sin-api" };
    let h;
    try { h = await window.showSaveFilePicker({ suggestedName: C.nombreArchivo(), types: C.tiposArchivo }); }
    catch (e) { if (e && e.name !== "AbortError") anotar("crear archivo: falló el selector", e); return { ok: false, motivo: "cancelado" }; }
    anotar("crear archivo: elegido");
    let previo = null, fallo = false;
    try { previo = await leerJSONde(h); } catch (e) { fallo = true; anotar("crear archivo: no se pudo leer el elegido", e); }
    if (fallo) {
      C.aviso("No se conectó el archivo", "<b>" + esc(h.name) + "</b> ya existe y no se pudo leer. Para no perder lo que tenga, no se escribió nada. Elige otro nombre.");
      return { ok: false, motivo: "ilegible" };
    }
    if (previo && !C.estaVacio(previo)) {
      const r = await elegirVersion(h.name, previo);
      if (!r) return { ok: false, motivo: "cancelado" };
      if (r === "archivo") {
        archivoPendiente = null; await reemplazarPor(previo); archivo = h; await recordarArchivo(h);
        await guardarLocal(); sucio = false; await anotarHuella(previo); avisar();
        return { ok: true, cargado: true };
      }
      await respaldar(previo, true);
    }
    archivo = h; archivoPendiente = null; errorArchivo = null;
    await recordarArchivo(h);
    const ok = await guardarArchivo();
    avisar();
    return { ok };
  }

  /* Al arrancar: el archivo recordado queda pendiente salvo que ya tenga permiso. */
  async function reconectarRecordado() {
    let h = null;
    try { h = await leer("meta", "archivo"); } catch (e) { h = null; anotar("al abrir: no se pudo leer el archivo recordado", e); }
    if (!h || typeof h.getFile !== "function") { anotar("al abrir: sin archivo recordado"); return; }
    anotar("al abrir: hay archivo recordado");
    archivoPendiente = h;
    if (await permisoEscritura(h, false)) await reconectar(true);
    avisar();
  }
  /* Reconectar con un toque (requestPermission lo exige). GUARDA 1: si no se lee, no se conecta. */
  async function reconectar(sinGesto) {
    const h = archivoPendiente;
    if (!h || perdioTurno) return { ok: false, motivo: "sin-pendiente" };
    if (!await permisoEscritura(h, !sinGesto)) return { ok: false, motivo: "sin-permiso" };
    let enArchivo = null, fallo = false, motivo = "";
    try { enArchivo = await leerJSONde(h); } catch (e) { fallo = true; motivo = e.message; }
    if (fallo) {
      anotar("reconectar: no se pudo leer el archivo · " + motivo);
      C.aviso("No se reconectó el archivo", "No se pudo leer <b>" + esc(h.name) + "</b> (" + esc(motivo) + "). No se conectó ni se escribió nada. Puedes olvidarlo y conectar otro desde Ajustes.");
      avisar(); return { ok: false, motivo: "ilegible" };
    }
    /* El archivo quedó como lo dejó esta app la última vez: lo anotado desde
       entonces es lo más nuevo y se escribe sin preguntar. Si cambió por fuera
       (otro teléfono, otra copia), se pregunta qué conservar. */
    const sinCambiosFuera = !!enArchivo && (await huellaAnotada()) === huella(enArchivo);
    const eleccion = sinCambiosFuera ? "telefono" : await elegirVersion(h.name, enArchivo);
    if (!eleccion) return { ok: false, motivo: "cancelado" };
    archivoPendiente = null;
    if (eleccion === "archivo" && enArchivo) {
      await reemplazarPor(enArchivo);
      archivo = h; errorArchivo = null;
      await guardarLocal(); sucio = false; await anotarHuella(enArchivo); avisar();
      return { ok: true, cargado: true };
    }
    if (enArchivo && !C.estaVacio(enArchivo) && !sinCambiosFuera) await respaldar(enArchivo, true);
    archivo = h; errorArchivo = null;
    await guardarLocal();
    const ok = await guardarArchivo();
    avisar();
    return { ok };
  }
  async function desvincular() {
    archivo = null; archivoPendiente = null; errorArchivo = null;
    await olvidarArchivo(); await anotarHuella(null); avisar();
  }

  /* ── exportar e importar (siempre disponibles) ── */
  async function documentoExportable() {
    const d = C.documento();
    if (!d) return null;
    const out = JSON.parse(JSON.stringify(d));
    out.exportado_en = Date.now();
    out.fotos = {};
    try {
      for (const [k, blob] of await todas("fotos")) if (blob) out.fotos[k] = await blobADataUrl(blob);
    } catch (e) { /* sin fotos: el resto se exporta igual */ }
    return out;
  }
  async function exportar(compartir) {
    const d = await documentoExportable();
    if (!d) return { ok: false };
    const nombre = C.nombreArchivo(true), texto = JSON.stringify(d, null, 1);
    if (compartir && typeof navigator !== "undefined" && navigator.share && typeof File === "function") {
      try {

/* ═══ PINTADO ═══ */

  }
  app.innerHTML = html;
  vistaPintada = ui.vista;

  if (nueva && scroll) nueva.scrollTop = scroll;

    rutina: vRutina, elegir: vElegir, progreso: vProgreso, peso: vPeso, ajustes: vAjustes }[ui.vista] || vInicio;

}
function nav() {
  const it = [["inicio", "Inicio"], ["ejercicios", "Ejercicios"], ["progreso", "Progreso"], ["peso", "Peso"], ["ajustes", "Ajustes"]];

/* ── Inicio ── */

  const f = hoy();
  const c = L.constancia(estado, f);

    (c.ultimaFecha ? c.diasSinEntrenar : "—") + '</span></div><div class="sep">';
  if (c.ultimaFecha) {
    const ult = L.sesionesValidas(estado).filter((s) => s.fecha === c.ultimaFecha && L.tieneTrabajo(s)).sort((a, b) => L.seriesDe(b).length - L.seriesDe(a).length)[0];
    const n = ult ? L.seriesDe(ult).filter((x) => x.tipo === "trabajo").length : 0;

  // Peso corporal destacado

function calendario(f) {

  for (const c of cal.celdas) {
    if (!c) { h += "<span></span>"; continue; }

    h += '<span style="font-weight:600;font-size:14px">' + esc(L.mayuscula(L.fechaLarga(cs.fecha).replace(/ de .*/, ""))) + (cs.series ? " · " + cs.series + " series" : "") + '</span><span class="pequeno tenue">' +
      esc(cs.series ? listaGrupos(cs.grupos) : cs.hoy ? "Hoy" : cs.futuro ? "Todavía no llega" : "Descanso") + "</span>";

function listaGrupos(gs) {

function hojaEntrenar() {

  let h = '<div class="fila entre"><h2 style="font-size:20px;font-weight:700">¿Cómo empiezas?</h2><button class="icono" data-a="cerrarCapa" data-capa="{capa}" aria-label="Cerrar">' + ic("x") + "</button></div>";

  const otras = L.rutinasOrdenadas(estado).filter((r) => !toca || r.id !== toca.id);

/* ── Sesión ── */
function refDe(s) { return { id: s.id, fecha: s.fecha, iniciada_en: s.iniciada_en }; }
function durTexto(s) {
  if (!s.iniciada_en) return "";
  const m = Math.max(0, Math.round(((s.terminada_en || Date.now()) - s.iniciada_en) / 60000));
  return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m + " min";
}
function vSesion() {
  const s = L.sesionPorId(estado, ui.params.id);
  if (!s) return '<main class="vista"><p>No se encontró la sesión.</p><button class="btn" data-a="ir" data-v="inicio">Volver</button></main>';

  if (ui.abierto[s.id] == null) {
    const i = corrigiendo ? s.ejercicios.findIndex((b) => b.filas.length > 0)
      : s.ejercicios.findIndex((b) => !b.filas.some((f) => f.tipo === "trabajo") || b.filas.some((f) => f.tipo === "trabajo" && !f.hecha));
    ui.abierto[s.id] = i >= 0 ? i : 0;
  }
  let h = '<header class="ses-cab"><div class="col" style="gap:3px;min-width:0"><h1>' + esc(corrigiendo ? "Corregir · " + (s.rutina_nombre || "sesión") : s.rutina_nombre || "Sesión libre") + '</h1><div class="meta"><span class="num" id="ses-dur">' +
    esc(durTexto(s)) + "</span>" + (s.fecha !== hoy() ? "<span>· " + esc(L.fechaCorta(s.fecha)) + "</span>" : "") + pildora(true) + "</div></div>" +
    '<div class="fila" style="gap:4px;flex:0 0 auto"><button class="icono" data-a="menuSesion" aria-label="Más opciones de la sesión">' + ic("puntos") + "</button>" +
    '<button class="btn" data-a="terminar">' + (corrigiendo ? "Listo" : "Terminar") + "</button></div></header>";
  h += '<main class="vista" style="gap:10px;padding-top:12px">';
  if (!corrigiendo) {
    const desc = s.ejercicios.map((b) => L.sugerencia(estado, b.ejercicio_id, refDe(s), b.series_plan)).find((x) => x && x.regla === "descarga");
    if (desc) h += '<div class="nota" role="note"><div class="cuerpo"><span class="mini" style="font-weight:700;letter-spacing:.02em">SUGERENCIA</span><b>Volviste tras ' + desc.dias + " días: empieza un " +
      Math.round(L.ajustesDe(estado).descarga_pct * 100) + ' % más liviano</b><span class="pequeno">Los pesos de hoy ya vienen rebajados. Si te sientes bien, súbelos con +.</span></div></div>';
  }
  if (!s.ejercicios.length) h += '<p class="tenue" style="text-align:center;margin:24px 0 0">Sesión en blanco. Agrega el primer ejercicio.</p>';
  s.ejercicios.forEach((b, i) => { h += ui.abierto[s.id] === i ? bloqueAbierto(s, b, i, corrigiendo) : bloqueCerrado(s, b, i); });
  h += '<button class="btn punteado ancho" style="height:48px" data-a="agregarEj">' + ic("plus", 18) + " Agregar ejercicio</button>";
  if (s.rutina_id && L.rutinasOrdenadas(estado).some((r) => r.id === s.rutina_id)) h += '<span class="mini tenue" style="text-align:center">Los cambios de hoy no modifican la rutina guardada «' + esc(s.rutina_nombre) + "». Para guardarlos, usa ⋯.</span>";
  h += "</main>";
  if (!corrigiendo && s.descanso) {
    const resta = Math.max(0, Math.ceil((s.descanso.fin - Date.now()) / 1000));
    if (resta > 0) {
      h += '<div class="descanso" role="timer" aria-label="Descanso"><span class="barra" id="desc-barra" style="width:' + Math.min(100, Math.round(resta / s.descanso.total * 100)) + '%"></span><div class="col" style="gap:0;flex:1 1 auto"><span class="mini tenue" style="font-weight:600">Descanso</span><span class="t num" id="desc-t">' +
        reloj(resta) + '</span></div><button class="btn" data-a="descanso30">+30 s</button><button class="btn texto" data-a="descansoFin">Saltar</button></div>';
    } else {
      h += '<div class="descanso fin" role="status"><span style="color:var(--accent)">' + ic("check") + '</span><span style="flex:1 1 auto;font-weight:600">Descanso terminado · a la siguiente serie</span><button class="btn texto" data-a="descansoFin">Cerrar</button></div>';
    }

}
const reloj = (seg) => Math.floor(seg / 60) + ":" + L.dosDig(seg % 60);
function bloqueCerrado(s, b, i) {
  const e = L.ejercicioPorId(estado, b.ejercicio_id) || { nombre: "Ejercicio borrado" };
  const t = b.filas.filter((f) => f.tipo === "trabajo"), hechas = t.filter((f) => f.hecha).length;
  const completo = t.length > 0 && hechas === t.length;
  let res;
  const pc = e.equipo === "peso_corporal";
  const base = t.length ? (pc && t.every((f) => !f.peso) ? t.map((f) => f.reps == null ? "—" : f.reps).join(", ") + " reps" : t[0].peso == null ? "sin datos" : L.resumenSeries(t.map((f) => ({ peso: f.peso || 0, reps: f.reps || 0 })))) : "sin series";
  if (completo) res = hechas + " de " + t.length + " · " + base;
  else if (hechas === 0) res = (s.terminada_en ? "" : "Hoy ") + base;
  else res = hechas + " de " + t.length + " · sigue la serie " + (hechas + 1);
  return '<div class="ej-cerrado"><button class="abrir" data-a="abrirEj" data-i="' + i + '" aria-expanded="false"><span class="bola ' + (completo ? "lista" : "") + '">' + (completo ? ic("check", 16, 2.6) : i + 1) +
    '</span><span style="min-width:0"><span class="ej-nom">' + esc(e.nombre) + '</span><span class="ej-res num">' + esc(res) + "</span></span></button>" +
    '<button class="icono" data-a="menuEj" data-i="' + i + '" aria-label="Opciones de ' + esc(e.nombre) + '">' + ic("puntos") + "</button></div>";
}
function bloqueAbierto(s, b, i, corrigiendo) {
  const e = L.ejercicioPorId(estado, b.ejercicio_id) || { id: b.ejercicio_id, nombre: "Ejercicio borrado", salto: 2.5, equipo: "otro", descanso_s: 90, reps_min: 8, reps_max: 12 };
  const ref = refDe(s);
  const sg = corrigiendo ? null : L.sugerencia(estado, e.id, ref, b.series_plan);
  const u = corrigiendo ? null : L.ultimaVez(estado, e.id, ref);
  const pc = e.equipo === "peso_corporal";

function filaSerie(s, b, i, e, f, j, n, pc) {

/* ── Tarjeta de kilos levantados (TarjetaKilos.tsx) ── */
function tarjetaKilos(kilos, titulo, pie) {
  if (!(kilos > 0)) return "";

  return '<section class="kilos-tarjeta" aria-label="Kilos levantados"><span class="t">' + esc(titulo) + '</span><span class="k num">' + L.miles(kilos) + " kg</span>" +
    (eq ? '<span style="font-size:15px;opacity:.9">' + esc(frase) + '</span><span class="ico" aria-hidden="true">' + eq.icono + "</span>" : "") +
    '<button data-a="compartirKilos" data-kilos="' + kilos + '" data-titulo="' + esc(titulo) + '" data-pie="' + esc(pie) + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Compartir</button></section>';
}
/** La tarjeta en una imagen de 1080×1080, siempre con los colores de la marca. */
function dibujarTarjeta(t) {
  const Lado = 1080, cv = document.createElement("canvas");
  cv.width = Lado; cv.height = Lado;
  const c = cv.getContext("2d");
  const letra = getComputedStyle(document.body).fontFamily || "sans-serif";
  c.fillStyle = "#2E5E74"; c.fillRect(0, 0, Lado, Lado);
  c.fillStyle = "#FFFFFF"; c.textAlign = "center"; c.textBaseline = "middle";
  c.globalAlpha = 0.9; c.font = "600 54px " + letra; c.fillText(t.titulo, Lado / 2, 230, Lado - 120);
  c.globalAlpha = 1; c.font = "700 150px " + letra; c.fillText(t.kilos, Lado / 2, 370, Lado - 120);
  if (t.frase) {
    c.globalAlpha = 0.9; c.font = "500 52px " + letra; c.fillText(t.frase, Lado / 2, 500, Lado - 120);
    c.globalAlpha = 1; c.font = "240px " + letra; c.fillText(t.icono, Lado / 2, 720);
  }
  c.globalAlpha = 0.75; c.font = "600 40px " + letra;
  c.textAlign = "left"; c.fillText("Rutina", 80, Lado - 90);
  c.textAlign = "right"; c.fillText(t.pie, Lado - 80, Lado - 90);
  return new Promise((ok, mal) => cv.toBlob((b) => (b ? ok(b) : mal(new Error("Sin imagen"))), "image/png"));
}

  c.fillStyle = "#FFFFFF"; c.font = "800 72px " + letra; c.fillText(t.nombre, 64, 190, W - 128);
  const imgs = await Promise.all([t.sexo + "-frente", t.sexo + "-espalda"].map((k) => imagenDeSvg(svgMapa(k, t.series, t.cortes, "imagen"))));
  const alto = 790, y = 236, anchos = imgs.map((im) => alto * im.width / im.height), sep = 60;
  let x = (W - anchos[0] - anchos[1] - sep) / 2;
  imgs.forEach((im, i) => { c.drawImage(im, x, y, anchos[i], alto); x += anchos[i] + sep; });
  // grupos en píldoras, centradas en filas
  c.font = "600 34px " + letra;
  const pills = ordenMapa(t.series).map((gr) => { const txt = L.textoGrupo(gr) + " · " + L.kg(t.series[gr]); return { txt, n: Math.max(0, nivelMapa(t.series[gr], t.cortes)), w: c.measureText(txt).width + 76 }; });
  const filas = [[]]; let ancho = 0;
  for (const pl of pills) { if (ancho + pl.w > W - 128 && filas[filas.length - 1].length) { filas.push([]); ancho = 0; } filas[filas.length - 1].push(pl); ancho += pl.w + 16; }
  let fy = 1066;
  for (const fila of filas.slice(0, 2)) {
    let fx = (W - fila.reduce((s, pl) => s + pl.w, 0) - 16 * (fila.length - 1)) / 2;
    for (const pl of fila) {
      c.fillStyle = "rgba(255,255,255,0.12)"; pildoraCanvas(c, fx, fy, pl.w, 64, 32); c.fill();
      c.fillStyle = MAPA_IMAGEN.nivel[pl.n]; c.beginPath(); c.arc(fx + 34, fy + 32, 10, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#FFFFFF"; c.fillText(pl.txt, fx + 56, fy + 44);
      fx += pl.w + 16;
    }
    fy += 80;
  }
  c.fillStyle = "#CFE3EC"; c.font = "500 34px " + letra; c.fillText(t.pie, 64, H - 60, W - 300);
  c.textAlign = "right"; c.font = "800 40px " + letra; c.fillStyle = "#FFFFFF"; c.fillText("Rutina", W - 64, H - 60);
  return new Promise((ok, mal) => cv.toBlob((b) => (b ? ok(b) : mal(new Error("Sin imagen"))), "image/png"));
}
/** Comparte una imagen con el menú del teléfono; si no se puede, la descarga. */
async function compartirImagen(blob, nombre, texto) {
  const archivo = typeof File === "function" ? new File([blob], nombre, { type: "image/png" }) : null;
  if (archivo && navigator.canShare && navigator.canShare({ files: [archivo] })) {
    await navigator.share({ files: [archivo], text: texto });
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Imagen descargada");
  }
}

/** Gráfico SVG propio: peso top (línea) y 1RM estimado (punteada). */
function graficoEjercicio(pts) {
  if (!pts.length) return '<span class="tenue pequeno">Sin datos todavía.</span>';
  const W = 320, H = 150, m = { l: 34, r: 8, t: 10, b: 22 };
  const xs = pts.map((p) => L.difDias(pts[0].fecha, p.fecha));
  const vals = pts.map((p) => p.top).concat(pts.map((p) => p.e1rm).filter(Boolean));
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 5) { min -= 2.5; max += 2.5; }
  min = Math.max(0, Math.floor(min)); max = Math.ceil(max);
  const xr = Math.max(1, xs[xs.length - 1]);
  const X = (x) => m.l + (pts.length === 1 ? (W - m.l - m.r) / 2 : (x / xr) * (W - m.l - m.r));
  const Y = (v) => m.t + (1 - (v - min) / (max - min || 1)) * (H - m.t - m.b);
  const linea = (k) => pts.map((p, i) => (p[k] ? X(xs[i]).toFixed(1) + "," + Y(p[k]).toFixed(1) : null)).filter(Boolean).join(" ");
  let s = '<svg class="graf" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Peso top y 1RM estimado en el tiempo">';
  for (const v of [min, (min + max) / 2, max]) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)"/><text x="' + (m.l - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + L.kg(Math.round(v)) + "</text>";
  s += '<text x="' + m.l + '" y="' + (H - 6) + '">' + esc(L.fechaCorta(pts[0].fecha)) + '</text><text x="' + (W - m.r) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(L.fechaCorta(pts[pts.length - 1].fecha)) + "</text>";
  const rm = linea("e1rm");
  if (rm) s += '<polyline points="' + rm + '" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3"/>';
  s += '<polyline points="' + linea("top") + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach((p, i) => { s += '<circle cx="' + X(xs[i]).toFixed(1) + '" cy="' + Y(p.top).toFixed(1) + '" r="3" fill="var(--accent)"/>'; });
  s += "</svg>";
  const u = pts[pts.length - 1];
  return s + '<div class="fila mini tenue" style="gap:14px;flex-wrap:wrap"><span class="fila" style="gap:6px"><i style="width:16px;height:3px;background:var(--accent)"></i>Peso top · <b class="num" style="color:var(--ink)">' + L.kg(u.top) + ' kg</b></span><span class="fila" style="gap:6px"><i style="width:16px;height:0;border-top:2px dashed var(--muted)"></i>1RM estimado · <b class="num" style="color:var(--ink)">' + (u.e1rm ? L.kg(u.e1rm) + " kg" : "—") + "</b></span></div>";
}
function chispa(vals) {
  if (vals.length < 2) return '<svg class="graf" viewBox="0 0 140 40" aria-hidden="true"></svg>';
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), r = max - min || 1;
  const pts = vals.map((v, i) => (4 + i / (vals.length - 1) * 132).toFixed(1) + "," + (36 - (v - min) / r * 32).toFixed(1)).join(" ");
  return '<svg class="graf" viewBox="0 0 140 40" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

  if (regs.length) {

      '</span></span><button class="icono" data-a="editarPeso" data-id="' + esc(p.id) + '" aria-label="Corregir">' + ic("repetir", 18) + '</button><button class="icono" data-a="borrarPeso" data-id="' + esc(p.id) + '" aria-label="Borrar">' + ic("papelera", 18) + "</button></div>").join("") + "</div></section>";
  } else h += '<p class="tenue">Anota tu peso cuando quieras; con varios registros verás la tendencia y el promedio de 7 días.</p>';

function graficoPeso(pts) {
  if (!pts.length) return '<span class="tenue pequeno">Sin registros en este rango.</span>';
  const W = 320, H = 160, m = { l: 34, r: 8, t: 10, b: 22 };
  const xs = pts.map((p) => L.difDias(pts[0].fecha, p.fecha)), xr = Math.max(1, xs[xs.length - 1]);
  const vals = pts.map((p) => p.kg).concat(pts.map((p) => p.prom));
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 2) { min -= 1; max += 1; }
  const X = (x) => m.l + (pts.length === 1 ? (W - m.l - m.r) / 2 : (x / xr) * (W - m.l - m.r));
  const Y = (v) => m.t + (1 - (v - min) / (max - min)) * (H - m.t - m.b);
  let s = '<svg class="graf" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Peso corporal y promedio móvil de 7 días">';
  for (const v of [min, (min + max) / 2, max]) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)"/><text x="' + (m.l - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + L.kg(Math.round(v * 10) / 10) + "</text>";
  s += '<text x="' + m.l + '" y="' + (H - 6) + '">' + esc(L.fechaCorta(pts[0].fecha)) + '</text><text x="' + (W - m.r) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(L.fechaCorta(pts[pts.length - 1].fecha)) + "</text>";
  pts.forEach((p, i) => { s += '<circle cx="' + X(xs[i]).toFixed(1) + '" cy="' + Y(p.kg).toFixed(1) + '" r="2.6" fill="var(--dash)"/>'; });
  s += '<polyline points="' + pts.map((p, i) => X(xs[i]).toFixed(1) + "," + Y(p.prom).toFixed(1)).join(" ") + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/></svg>';
  return s + '<div class="fila mini tenue" style="gap:14px"><span class="fila" style="gap:6px"><i style="width:8px;height:8px;border-radius:4px;background:var(--dash)"></i>Registro</span><span class="fila" style="gap:6px"><i style="width:16px;height:3px;background:var(--accent)"></i>Promedio móvil 7 días</span></div>';
}

  planSeries(el) {
    const s = sesionActual(), b = s && s.ejercicios[+el.dataset.i]; if (!b) return;

  moverEj(el) {
    const s = sesionActual(), i = +el.dataset.i, j = i + +el.dataset.d; if (!s || j < 0 || j >= s.ejercicios.length) return;
    cerrarHojas();
    cambiar(() => { const t = s.ejercicios[i]; s.ejercicios[i] = s.ejercicios[j]; s.ejercicios[j] = t; ui.abierto[s.id] = j; });
  },
  async quitarEj(el) {
    const s = sesionActual(), i = +el.dataset.i, b = s && s.ejercicios[i]; if (!b) return;
    cerrarHojas();
    const hechas = b.filas.filter((f) => f.hecha);

    cambiar(() => {
      for (const f of hechas) estado.papelera.push({ tipo: "serie", id: L.nuevoId(), borrada_en: Date.now(), sesion_id: s.id, ejercicio_id: b.ejercicio_id, fecha: s.fecha, fila: JSON.parse(JSON.stringify(f)) });
      s.ejercicios.splice(i, 1);

      (r ? '<button class="opcion" data-a="actualizarRutina"><span class="txt"><b>Actualizar «' + esc(r.nombre) + '» con esta sesión</b><small class="tenue">Reemplaza sus ejercicios y series</small></span></button>' : "") +
      '<button class="opcion" data-a="rutinaDeSesion"><span class="txt"><b>Guardar como rutina nueva</b><small class="tenue">Con los ejercicios de hoy, en este orden</small></span></button>' +
      '<label class="campo">Fecha de la sesión<input class="entrada" type="date" id="fecha-sesion" max="' + hoy() + '" value="' + esc(L.esFecha(s.fecha) ? s.fecha : "") + '"></label><button class="btn ancho" data-a="cambiarFecha">Guardar fecha</button><p class="error" id="error-fecha"></p>' +

  cambiarFecha() {
    const s = sesionActual(), v = ($("#fecha-sesion") || {}).value;
    if (!L.esFecha(v)) { $("#error-fecha").textContent = "Esa fecha no es válida."; return; }

  async actualizarRutina() {
    const s = sesionActual(); const r = estado.rutinas.find((x) => x.id === s.rutina_id); if (!r) return;
    cerrarHojas();
    if (!await confirmar("Actualizar rutina", "«" + esc(r.nombre) + "» quedará con los " + s.ejercicios.length + " ejercicios de hoy. Las sesiones pasadas no cambian.", "Actualizar")) return;
    const res = L.guardarRutina(estado, { id: r.id, nombre: r.nombre, ejercicios: s.ejercicios.map((b) => ({ ejercicio_id: b.ejercicio_id, series: b.series_plan })) });

  rutinaDeSesion() {
    const s = sesionActual(); if (!s || !s.ejercicios.length) { toast("La sesión no tiene ejercicios"); return; }
    cerrarHojas();
    ui.rutina = { id: L.nuevoId(), esNueva: true, nombre: "", ejercicios: s.ejercicios.map((b) => ({ ejercicio_id: b.ejercicio_id, series: b.series_plan })), desdeSesion: s.id };

  async borrarSesion(el) {
    const s = L.sesionPorId(estado, el.dataset.id); if (!s) return;
    cerrarHojas();
    const n = L.seriesDe(s).length;
    if (!await confirmar("Borrar sesión", "La sesión del " + esc(L.fechaLarga(s.fecha)) + " (" + n + " series) irá a la papelera. Se puede restaurar desde Ajustes.", "Borrar", "peligro")) return;
    cambiar((d) => { d.sesiones = d.sesiones.filter((x) => x.id !== s.id); if (n) d.papelera.push({ tipo: "sesion", id: L.nuevoId(), borrada_en: Date.now(), sesion: s }); }, true);
    ir("inicio", {}, true);
    toast("Sesión borrada", () => cambiar((d) => { d.papelera = d.papelera.filter((p) => !(p.tipo === "sesion" && p.sesion && p.sesion.id === s.id)); d.sesiones.push(s); }));
  },
  async terminar() {
    const s = sesionActual(); if (!s) return;
    const sinConfirmar = [];
    s.ejercicios.forEach((b) => b.filas.forEach((f) => { if (!f.hecha && f.tocada && f.peso != null && f.reps != null) sinConfirmar.push(f); }));
    if (sinConfirmar.length) {
      const r = await preguntar("Hay series sin ✓", sinConfirmar.length + (sinConfirmar.length === 1 ? " serie cambiada no está confirmada." : " series cambiadas no están confirmadas.") + " Solo se guarda lo confirmado.",
        [{ valor: "confirmar", texto: "Confirmarlas y terminar", tono: "prim" }, { valor: "sin", texto: "Terminar sin ellas" }, { valor: null, texto: "Volver" }]);
      if (!r) return;
      if (r === "confirmar") cambiar(() => sinConfirmar.forEach((f) => { f.hecha = true; f.completada_en = Date.now(); }), true);
    }
    const n = L.seriesDe(s).length;
    if (!n && s.terminada_en == null) {
      const r = await preguntar("La sesión no tiene series", "No hay ninguna serie confirmada.", [{ valor: "descartar", texto: "Descartar la sesión", tono: "peligro" }, { valor: "terminar", texto: "Terminar igual" }, { valor: null, texto: "Volver" }]);
      if (!r) return;
      if (r === "descartar") { cambiar((d) => { d.sesiones = d.sesiones.filter((x) => x.id !== s.id); }, true); ir("inicio", {}, true); return; }
    }
    const corrigiendo = s.terminada_en != null;
    cambiar(() => {
      s.ejercicios.forEach((b) => { b.filas = b.filas.filter((f) => f.hecha); });
      if (!corrigiendo) s.terminada_en = Math.max(Date.now(), s.iniciada_en || 0);
      s.descanso = null;
    }, true);
    await P.guardarAhora();
    ir("resumen", { id: s.id }, true);
  },
  grupo(el) { ui.grupo = el.dataset.g || null; render(); },

  nuevoEj() { ui.fotoPendiente = null; ui.quitarFoto = false; const vuelta = ui.vista === "elegir" ? ui.params : null; ir("editarEj", { volver: vuelta, nombre: ui.buscar.trim() }); },

  async guardarEj() {
    const form = $("#form-ej"); if (!form) return;
    const v = (n) => (form.elements[n] ? form.elements[n].value : "");
    const id = form.dataset.id || null;
    const err = (t) => { $("#error-ej").textContent = t; };
    const nombre = v("nombre").trim();
    if (!nombre) return err("Ponle un nombre.");
    if (estado.ejercicios.some((e) => e.id !== id && e.nombre.trim().toLowerCase() === nombre.toLowerCase())) return err("Ya hay un ejercicio con ese nombre" + (estado.ejercicios.some((e) => e.id !== id && !e.activo && e.nombre.trim().toLowerCase() === nombre.toLowerCase()) ? " (está retirado: reactívalo)." : "."));
    const grupo = v("grupo"), salto = L.leerNumero(v("salto")), rmin = L.leerNumero(v("reps_min")), rmax = L.leerNumero(v("reps_max")), series = L.leerNumero(v("series")), descanso = +v("descanso");
    if (salto === null || salto <= 0 || salto > 50) return err("El salto debe ser un número entre 0,25 y 50 kg (acepta coma).");
    if (rmin === null || rmax === null || rmin < 1 || rmax > 50 || Math.round(rmin) > Math.round(rmax)) return err("El rango de repeticiones va de 1 a 50, y el mínimo no puede pasar al máximo.");
    if (series === null || series < 1 || series > 10) return err("Las series van de 1 a 10.");
    const secundarios = Array.from(document.querySelectorAll('#secundarios [aria-pressed="true"]')).map((b) => b.dataset.g).filter((g) => g !== grupo);
    const datos = { nombre, grupo, secundarios, equipo: v("equipo"), salto: L.r2(salto), reps_min: Math.round(rmin), reps_max: Math.round(rmax), series: Math.round(series),
      descanso_s: descanso >= 15 && descanso <= 600 ? descanso : 90, pasos: v("pasos").split("\n").map((t) => t.trim()).filter(Boolean) };
    const nuevoId = id || L.nuevoId();
    if (ui.fotoPendiente) {
      try { await P.guardarFoto(nuevoId, ui.fotoPendiente); olvidarUrlFoto(nuevoId); datos.tiene_foto = true; }
      catch (e) { return err("No se pudo guardar la foto en el teléfono: " + e.message); }
    } else if (ui.quitarFoto) { await P.borrarFoto(nuevoId); olvidarUrlFoto(nuevoId); datos.tiene_foto = false; }
    const vuelta = ui.params.volver;
    cambiar((d) => {
      if (id) Object.assign(L.ejercicioPorId(d, id), datos);
      else d.ejercicios.push(Object.assign({ id: nuevoId, base_codigo: null, destacado: false, activo: true, tiene_foto: false, creado_en: Date.now() }, datos));
    }, true);
    ui.fotoPendiente = null; ui.quitarFoto = false;
    if (vuelta) { ui.params = vuelta; ui.vista = "elegir"; elegir(nuevoId); return; }
    toast(id ? "Ejercicio guardado" : "Ejercicio creado");
    if (id) A.atras(); else ir("ficha", { id: nuevoId }, true);
  },
  destacar(el) { const e = L.ejercicioPorId(estado, el.dataset.id); if (e) cambiar(() => { e.destacado = !e.destacado; }); },
  async retirar(el) {
    const e = L.ejercicioPorId(estado, el.dataset.id); if (!e) return;

  elegido(el) { elegir(el.dataset.id); },
  editarRutina(el) {
    const r = el.dataset.id ? estado.rutinas.find((x) => x.id === el.dataset.id) : null;
    ui.rutina = r ? { id: r.id, esNueva: false, nombre: r.nombre, ejercicios: r.ejercicios.map((x) => Object.assign({}, x)) } : { id: L.nuevoId(), esNueva: true, nombre: "", ejercicios: [] };

    const r = ui.rutina;
    const res = L.guardarRutina(estado, { id: r.esNueva ? null : r.id, nombre: r.nombre, ejercicios: r.ejercicios }, Date.now());

  graf(el) { ui.ejGrafico = el.dataset.id; render(); const s = $("select[data-c=ejGrafico]"); if (s) s.scrollIntoView({ block: "center", behavior: "smooth" }); },

    const form = $("#form-peso");

  editarPeso(el) { ui.pesoEdit = el.dataset.id; render(); const v = $(".vista"); if (v) v.scrollTop = 0; },
  async borrarPeso(el) {
    const p = estado.peso_corporal.find((x) => x.id === el.dataset.id); if (!p) return;
    cambiar((d) => { d.peso_corporal = d.peso_corporal.filter((x) => x.id !== p.id); });

  pesoRango(el) { ui.pesoRango = +el.dataset.v; render(); },
  diaHab(el) {
    const d = +el.dataset.d, aj = L.ajustesDe(estado);
    const nuevo = aj.dias_habituales.indexOf(d) >= 0 ? aj.dias_habituales.filter((x) => x !== d) : aj.dias_habituales.concat([d]).sort();
    if (!nuevo.length) { toast("Deja al menos un día habitual"); return; }
    cambiar((e) => { e.ajustes = L.sanearAjustes(Object.assign({}, aj, { dias_habituales: nuevo })); });
  },
  ajuste(el) {
    const k = el.dataset.k, d = +el.dataset.d, aj = L.ajustesDe(estado);
    const paso = k === "descarga_pct" ? 0.05 : 1;
    cambiar((e) => { const o = Object.assign({}, aj); o[k] = Math.round((aj[k] + d * paso) * 100) / 100; e.ajustes = L.sanearAjustes(o); });
  },
  async restaurar(el) {
    const it = estado.papelera.find((x) => x.id === el.dataset.id); if (!it) return;
    if (it.tipo === "sesion") {
      if (L.sesionPorId(estado, it.sesion.id)) { toast("Esa sesión ya está en la lista"); cambiar((d) => { d.papelera = d.papelera.filter((x) => x.id !== it.id); }); return; }
      cambiar((d) => { d.sesiones.push(it.sesion); d.papelera = d.papelera.filter((x) => x.id !== it.id); }); toast("Sesión restaurada"); return;
    }
    const s = L.sesionPorId(estado, it.sesion_id);
    if (!s) { aviso("No se pudo restaurar", "La sesión de esta serie no está: si está en la papelera, restáurala primero."); return; }
    cambiar((d) => {
      let b = s.ejercicios.find((x) => x.ejercicio_id === it.ejercicio_id);
      if (!b) { b = { ejercicio_id: it.ejercicio_id, series_plan: 3, filas: [] }; s.ejercicios.push(b); }
      if (!b.filas.some((f) => f.id === it.fila.id)) b.filas.push(it.fila);
      d.papelera = d.papelera.filter((x) => x.id !== it.id);
    });
    toast("Serie restaurada");
  },
  async vaciarPapelera() {
    if (!await confirmar("Vaciar papelera", "Se borran para siempre " + estado.papelera.length + " elementos. No se puede deshacer.", "Vaciar para siempre", "peligro")) return;
    cambiar((d) => { d.papelera = []; });
  }
};
/* ── Bienvenida: nombre → peso inicial → dónde guardar ── */

      '<label class="campo" style="font-size:15px">¿Cómo te llamas?<input class="entrada" ' + grande + ' id="bv-nombre" maxlength="40" autocapitalize="words" autocomplete="given-name" enterkeyhint="next" data-enter="bvNombre" data-enfocar value="' + esc(pf.nombre) + '"></label>' +

      '<p class="error" id="bv-error" role="alert"></p><button class="btn prim grande" data-a="bvNombre">Siguiente</button>' +
      '<div class="col" style="gap:8px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)"><span class="pequeno tenue">¿Ya usabas Rutina en otro teléfono o abierta desde Archivos? Trae tus datos:</span>' +
      (api ? '<button class="btn ancho" data-a="bvAbrir">' + ic("archivo", 18) + " Abrir mi archivo .json</button>" : "") +

    if (api) h += '<button class="opcion prim" data-a="bvCrear"><span class="txt"><b style="font-size:17px">Crear un archivo nuevo</b><small>' + esc(L.nombreArchivo(estado, false)) + ' · se actualiza solo</small></span>' + ic("der") + "</button>" +

function terminarBienvenida() { cambiar((d) => { d.perfil.bienvenida_hecha = true; }, true); ir("inicio", {}, true); }
