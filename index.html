/* ═══ PINTADO ═══ */
let vistaPintada = null;
function render(nuevaVista) {
  const app = $("#app");
  if (!app) return;
  const vieja = app.querySelector(".vista");
  const scroll = vieja && !nuevaVista && vistaPintada === ui.vista ? vieja.scrollTop : 0;
  let html = "";
  try { html = franjas() + pintarVista(); }
  catch (e) {
    console.error(e);
    html = '<main class="vista"><div class="nota peligro"><div class="cuerpo"><b>Algo falló al mostrar esta pantalla</b><span>' + esc(e.message) +
      '</span><div class="acciones"><button class="btn" data-a="ir" data-v="inicio">Volver al inicio</button></div></div></div></main>';
  }
  app.innerHTML = html;
  vistaPintada = ui.vista;
  const nueva = app.querySelector(".vista");
  if (nueva && scroll) nueva.scrollTop = scroll;
  const s = ui.vista === "sesion" && estado ? L.sesionPorId(estado, ui.params.id) : null;
  if (s && s.terminada_en == null) Pantalla.pedir(); else Pantalla.soltar();
  cargarFotos();
  const foco = app.querySelector("[data-enfocar]");
  if (foco) { try { foco.focus(); foco.select && foco.select(); } catch (e) {} }
}
function pintarVista() {
  if (ui.vista === "rescate" || (!estado && P.ilegible())) return vRescate();
  if (!estado) return '<main class="vista"><p class="tenue">Cargando…</p></main>';
  const conNav = ["inicio", "ejercicios", "progreso", "peso", "ajustes"].indexOf(ui.vista) >= 0;
  const f = { bienvenida: vBienvenida, inicio: vInicio, sesion: vSesion, resumen: vResumen, ejercicios: vEjercicios, ficha: vFicha, editarEj: vEditarEj,
    rutina: vRutina, elegir: vElegir, progreso: vProgreso, peso: vPeso, ajustes: vAjustes }[ui.vista] || vInicio;
  return f() + (conNav ? nav() : "");
}
function nav() {
  const it = [["inicio", "Inicio"], ["ejercicios", "Ejercicios"], ["progreso", "Progreso"], ["peso", "Peso"], ["ajustes", "Ajustes"]];
  const actual = ui.vista;
  return '<nav class="nav" aria-label="Navegación">' + it.map((x) => '<button data-a="ir" data-v="' + x[0] + '"' + (actual === x[0] ? ' aria-current="page"' : "") +
    '><span class="p">' + ic(x[0], 22, 1.75) + "</span>" + x[1] + "</button>").join("") + "</nav>";
}
/** Franjas fijas arriba: solo lectura, sin almacenamiento. */
function franjas() {
  let h = "";
  if (P.soloLectura()) h += franja("La app se abrió en otra pestaña", "Esta quedó en solo lectura para que no se pisen los datos.", '<button class="btn" data-a="recargar">Recargar</button>');
  if (!P.almacenamientoOk()) h += franja("El almacenamiento del navegador no está disponible", "Lo que anotes se perderá al cerrar. Toca «Guardar respaldo» en Ajustes.", '<button class="btn" data-a="ir" data-v="ajustes">Ajustes</button>', true);
  return h;
}
function franja(titulo, detalle, boton, peligro) {
  return '<div class="nota ' + (peligro ? "peligro" : "") + '" style="border-radius:0;flex:0 0 auto;align-items:center" role="status"><div class="cuerpo"><b>' + titulo + '</b><span class="pequeno">' + detalle + "</span></div>" + boton + "</div>";
}

/* ── Inicio ── */
function vInicio() {
  const f = hoy();
  const c = L.constancia(estado, f);
  const enCurso = L.sesionEnCurso(estado);
  const activos = estado.ejercicios.filter((e) => e.activo);
  const nom = estado.perfil && estado.perfil.nombre;
  let h = '<main class="vista"><header class="cab"><div class="t"><span class="fecha">' + esc(L.mayuscula(L.fechaLarga(f))) + "</span><h1>" + (nom ? "Hola, " + esc(nom.split(" ")[0]) : "Rutina") + "</h1></div>" + pildora() + "</header>";
  h += avisosPwa() + avisosInicio(c);
  if (enCurso) {
    const ini = enCurso.iniciada_en ? new Date(enCurso.iniciada_en) : null;
    const cuando = ini ? (enCurso.fecha === f ? "desde las " : "desde el " + L.fechaCorta(enCurso.fecha) + ", ") + L.dosDig(ini.getHours()) + ":" + L.dosDig(ini.getMinutes()) : "";
    h += '<div class="nota suave"><div class="cuerpo"><b>Sesión en curso</b><span class="pequeno">' + esc((enCurso.rutina_nombre || "Sesión libre") + " · " + cuando) +
      '</span><div class="acciones"><button class="btn prim" data-a="ir" data-v="sesion" data-id="' + esc(enCurso.id) + '">Continuar</button></div></div></div>';
  }
  // Días sin entrenar + última sesión (mismo cálculo que el aviso)
  h += '<section class="tarjeta dias" aria-label="Días sin entrenar"><div class="col" style="gap:0;flex:0 0 auto"><span class="pequeno tenue" style="font-weight:600">Días sin entrenar</span><span class="grande num">' +
    (c.ultimaFecha ? c.diasSinEntrenar : "—") + '</span></div><div class="sep">';
  if (c.ultimaFecha) {
    const ult = L.sesionesValidas(estado).filter((s) => s.fecha === c.ultimaFecha && L.tieneTrabajo(s)).sort((a, b) => L.seriesDe(b).length - L.seriesDe(a).length)[0];
    const n = ult ? L.seriesDe(ult).filter((x) => x.tipo === "trabajo").length : 0;
    const min = ult && ult.terminada_en && ult.iniciada_en ? Math.round((ult.terminada_en - ult.iniciada_en) / 60000) : null;
    h += '<span class="pequeno tenue">Última sesión · ' + esc(L.hace(c.ultimaFecha, f)) + '</span><span style="font-size:17px;font-weight:600">' + esc((ult && ult.rutina_nombre) || "Sesión") + ", " + esc(L.fechaLarga(c.ultimaFecha).replace(/ de .*/, "")) +
      '</span><span class="pequeno tenue">' + n + " series" + (min ? " · " + min + " min" : "") + "</span>" +
      '<span class="mini tenue">Cuenta días habituales (' + esc(c.habituales.map((d) => L.DIAS_CORTOS[d - 1]).join(" ")) + "), sin hoy.</span>";
  } else h += '<span class="pequeno tenue">Aún no hay sesiones</span><span style="font-size:15px;font-weight:600">Tu primera sesión empieza con «Entrenar».</span>';
  h += "</div></section>";
  // Peso corporal destacado
  const pesos = L.pesosOrdenados(estado);
  if (pesos.length) {
    const u = pesos[pesos.length - 1], c7 = L.cambioPeso(pesos, 7);
    h += '<button class="tarjeta fila entre" data-a="ir" data-v="peso" style="text-align:left;width:100%"><span class="col" style="gap:0"><span class="pequeno tenue" style="font-weight:600">Peso corporal · ' + esc(L.fechaCorta(u.fecha)) +
      '</span><span class="num" style="font-size:28px;font-weight:700">' + L.kg(u.kg) + ' <small class="tenue" style="font-size:14px;font-weight:500">kg</small></span></span><span class="pequeno tenue num" style="text-align:right">' +
      (c7 ? (c7.delta > 0 ? "+" : "") + L.kg(c7.delta) + " kg en 7 días" : "Sin dato de hace 7 días") + "</span></button>";
  }
  h += calendario(f);
  if (!activos.length) {
    h += '<section class="tarjeta col"><h2>Todavía no hay ejercicios</h2><span class="tenue">Empieza con la lista base o arma la tuya.</span><button class="btn prim ancho" data-a="sembrar">Cargar la lista base (32 ejercicios comunes)</button><button class="btn ancho" data-a="nuevoEj">Crear los míos</button></section>';
  } else if (enCurso) {
    h += '<button class="btn prim grande" data-a="ir" data-v="sesion" data-id="' + esc(enCurso.id) + '">Continuar sesión</button>';
  } else {
    const toca = L.rutinaQueToca(estado);
    h += '<div class="col"><button class="btn prim grande" data-a="entrenar">Entrenar</button>' + (toca ? '<span class="pequeno tenue" style="text-align:center">Hoy toca ' + esc(toca.nombre) + "</span>" : "") + "</div>";
  }
  return h + "</main>";
}
function avisosInicio(c) {
  let h = "";
  if (c.aviso && c.textoAviso) {
    const toca = L.rutinaQueToca(estado);
    h += '<div class="nota" role="status">' + ic("reloj") + '<div class="cuerpo"><b>' + esc(c.textoAviso.titulo) + "</b><span>" + esc(c.textoAviso.detalle) +
      (toca ? " Cuando puedas, " + esc(toca.nombre) + " está lista para empezar." : " Cuando puedas, aquí estamos.") + "</span></div></div>";
  }
  if (DEMO) return h;   // demos: sin avisos de respaldo ni de instalar
  /* Respaldo manual, igual en Android e iPhone: aviso a los 3 días sin respaldo (solo cuentan los
     compartidos y descargas que salieron bien). */
  if (P.respaldoVencido()) {
    const dias = P.diasSinRespaldo();
    h += '<div class="nota" role="status"><div class="cuerpo"><b>' + (P.ultimoRespaldo() ? "Van " + dias + " días sin respaldo" : "Aún no guardas un respaldo") +
      '</b><span class="pequeno">Toca «Guardar respaldo» y elige ' + esc(DESTINOS_RESPALDO()) + '. Si algo le pasa al teléfono o a la app, de ahí recuperas todo.</span>' +
      '<div class="acciones"><button class="btn prim" data-a="guardarRespaldo">Guardar respaldo</button></div></div></div>';
  }
  return h;
}
function calendario(f) {
  const mes = ui.mes || f.slice(0, 7);
  const cal = L.calendarioMes(estado, mes, f);
  if (!cal) return "";
  const sel = ui.diaSel && ui.diaSel.slice(0, 7) === mes ? ui.diaSel : (f.slice(0, 7) === mes ? f : null);
  let h = '<section class="tarjeta col" style="padding:12px" aria-label="Calendario"><div class="fila entre"><button class="icono" data-a="mes" data-d="-1" aria-label="Mes anterior">' + ic("izq", 18) +
    '</button><div class="col" style="gap:0;align-items:center"><h2>' + esc(cal.titulo) + '</h2><span class="mini tenue">' + cal.sesiones + (cal.sesiones === 1 ? " sesión" : " sesiones") + '</span></div><button class="icono" data-a="mes" data-d="1" aria-label="Mes siguiente"' +
    (mes >= f.slice(0, 7) ? " disabled" : "") + ">" + ic("der", 18) + '</button></div><div class="cal-sem" aria-hidden="true">' + L.DIAS_CORTOS.map((d) => "<span>" + d + "</span>").join("") + '</div><div class="cal-grid">';
  for (const c of cal.celdas) {
    if (!c) { h += "<span></span>"; continue; }
    h += '<button class="cal-dia num ' + (c.futuro ? "futuro" : "n" + c.nivel) + (c.hoy ? " hoy" : "") + '" data-a="dia" data-f="' + c.fecha + '" aria-pressed="' + (sel === c.fecha) + '" aria-label="' +
      esc(L.fechaLarga(c.fecha) + (c.series ? ", " + c.series + " series" : "")) + '">' + c.n + "</button>";
  }
  h += "</div>";
  const cs = sel ? cal.celdas.find((x) => x && x.fecha === sel) : null;

/* ── Sesión ── */
function refDe(s) { return { id: s.id, fecha: s.fecha, iniciada_en: s.iniciada_en }; }
function durTexto(s) {
  if (!s.iniciada_en) return "";

function vSesion() {

    const i = corrigiendo ? s.ejercicios.findIndex((b) => b.filas.length > 0)

    '<div class="fila" style="gap:4px;flex:0 0 auto"><button class="icono" data-a="menuSesion" aria-label="Más opciones de la sesión">' + ic("puntos") + "</button>" +

function filaSerie(s, b, i, e, f, j, n, pc) {

    '<button data-a="compartirKilos" data-kilos="' + kilos + '" data-titulo="' + esc(titulo) + '" data-pie="' + esc(pie) + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Compartir</button></section>';
}
/** La tarjeta en una imagen de 1080×1080, siempre con los colores de la marca. */
function dibujarTarjeta(t) {
  const Lado = 1080, cv = document.createElement("canvas");
  cv.width = Lado; cv.height = Lado;
  const c = cv.getContext("2d");
  const letra = getComputedStyle(document.body).fontFamily || "sans-serif";
  c.fillStyle = "#2E5E74"; c.fillRect(0, 0, Lado, Lado);
  c.fillStyle = "#FFFFFF"; c.textAlign = "center"; c.textBaseline = "middle";
  c.globalAlpha = 0.9; c.font = "600 54px " + letra; c.fillText(t.titulo, Lado / 2, 230, Lado - 120);
  c.globalAlpha = 1; c.font = "700 150px " + letra; c.fillText(t.kilos, Lado / 2, 370, Lado - 120);
  if (t.frase) {
    c.globalAlpha = 0.9; c.font = "500 52px " + letra; c.fillText(t.frase, Lado / 2, 500, Lado - 120);
    c.globalAlpha = 1; c.font = "240px " + letra; c.fillText(t.icono, Lado / 2, 720);
  }
  c.globalAlpha = 0.75; c.font = "600 40px " + letra;
  c.textAlign = "left"; c.fillText("Rutina", 80, Lado - 90);
  c.textAlign = "right"; c.fillText(t.pie, Lado - 80, Lado - 90);
  return new Promise((ok, mal) => cv.toBlob((b) => (b ? ok(b) : mal(new Error("Sin imagen"))), "image/png"));
}

function dibujarPantallaRecap(ctx, recap, indice, t, op) {

async function imagenRecap(recap, indice, alto, conPeso) {

/* Visor tipo historia: tocar a la derecha avanza, a la izquierda vuelve, mantener pausa. Solo lee el estado. */
const RECAP_DUR = 7000, RECAP_ANIM = 1400;
const visor = { abierto: false, recap: null, i: 0, t0: 0, pausaEn: null, conPeso: false, raf: 0, dibujadoT: -1, historia: false, ignorarPop: false, pulso: null, compartiendo: false };

async function abrirRecap() {
  if (!estado || visor.abierto) return;
  const recap = L.recapDelAnio(estado, L.anioRecap(hoy()), hoy());
  await prepararRecap(recap);
  Object.assign(visor, { abierto: true, recap: recap, i: 0, conPeso: false, pausaEn: null, pulso: null, compartiendo: false });
  document.body.insertAdjacentHTML("beforeend", '<div class="recap" id="recap" role="dialog" aria-modal="true" aria-label="' + esc(recap.titulo) + '">' +
    '<div class="recap-cab"><div class="recap-barras" aria-hidden="true">' + recap.pantallas.map(() => "<span><i></i></span>").join("") + "</div>" +
    '<button class="sr" data-a="recapPaso" data-d="-1">Pantalla anterior</button><button class="sr" data-a="recapPaso" data-d="1">Pantalla siguiente</button>' +
    '<button class="icono" data-a="cerrarRecap" aria-label="Cerrar el Recap">' + ic("x", 24, 2.2) + "</button></div>" +
    '<div class="recap-lienzo"><canvas id="recap-lienzo" width="' + RECAP_W + '" height="' + RECAP_H + '" role="img"></canvas></div>' +
    '<div class="recap-pie" id="recap-pie"></div></div>');
  const cv = $("#recap-lienzo");
  cv.addEventListener("pointerdown", (ev) => {
    visor.pulso = { x: ev.clientX, pausado: false };
    const p = visor.pulso;
    setTimeout(() => { if (visor.pulso === p && visor.pausaEn == null) { p.pausado = true; visor.pausaEn = performance.now(); } }, 280);
  });
  const soltar = (ev, navegar) => {
    const p = visor.pulso; visor.pulso = null;

    if (p.pausado) { if (visor.pausaEn != null) { visor.t0 += performance.now() - visor.pausaEn; visor.pausaEn = null; } return; }
    if (!navegar) return;
    const caja = cv.getBoundingClientRect();
    pasoRecap(ev.clientX < caja.left + caja.width / 3 ? -1 : 1);
  };
  cv.addEventListener("pointerup", (ev) => soltar(ev, true));
  cv.addEventListener("pointercancel", (ev) => soltar(ev, false));
  cv.addEventListener("pointerleave", (ev) => soltar(ev, false));
  cv.addEventListener("contextmenu", (ev) => ev.preventDefault());
  try { history.pushState({ vista: ui.vista, params: ui.params, recap: true }, ""); visor.historia = true; } catch (e) { visor.historia = false; }
  window.addEventListener("resize", ajustarRecap);

}
function cerrarRecap(desdeHistorial) {

  const el = $("#recap"); if (el) el.remove();
  if (!desdeHistorial && visor.historia) { visor.ignorarPop = true; try { history.back(); } catch (e) { visor.ignorarPop = false; } }

}
function ajustarRecap() {
  const caja = document.querySelector(".recap-lienzo"), cv = $("#recap-lienzo");
  if (!caja || !cv) return;
  const w = Math.max(100, Math.min(caja.clientWidth - 16, caja.clientHeight * 9 / 16));
  cv.style.width = Math.floor(w) + "px"; cv.style.height = Math.floor(w * 16 / 9) + "px";
}
function irPantallaRecap(i) {
  const r = visor.recap;
  visor.i = Math.max(0, Math.min(r.pantallas.length - 1, i));
  visor.t0 = performance.now(); visor.pausaEn = null; visor.dibujadoT = -1;

}
function pasoRecap(d) {

}
function cuadroRecap(ahora) {

/** Gráfico SVG propio: peso top (línea) y 1RM estimado (punteada). */
function graficoEjercicio(pts) {
  if (!pts.length) return '<span class="tenue pequeno">Sin datos todavía.</span>';
  const W = 320, H = 150, m = { l: 34, r: 8, t: 10, b: 22 };
  const xs = pts.map((p) => L.difDias(pts[0].fecha, p.fecha));
  const vals = pts.map((p) => p.top).concat(pts.map((p) => p.e1rm).filter(Boolean));
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 5) { min -= 2.5; max += 2.5; }
  min = Math.max(0, Math.floor(min)); max = Math.ceil(max);
  const xr = Math.max(1, xs[xs.length - 1]);
  const X = (x) => m.l + (pts.length === 1 ? (W - m.l - m.r) / 2 : (x / xr) * (W - m.l - m.r));
  const Y = (v) => m.t + (1 - (v - min) / (max - min || 1)) * (H - m.t - m.b);
  const linea = (k) => pts.map((p, i) => (p[k] ? X(xs[i]).toFixed(1) + "," + Y(p[k]).toFixed(1) : null)).filter(Boolean).join(" ");
  let s = '<svg class="graf" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Peso top y 1RM estimado en el tiempo">';
  for (const v of [min, (min + max) / 2, max]) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)"/><text x="' + (m.l - 4) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + L.kg(Math.round(v)) + "</text>";
  s += '<text x="' + m.l + '" y="' + (H - 6) + '">' + esc(L.fechaCorta(pts[0].fecha)) + '</text><text x="' + (W - m.r) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(L.fechaCorta(pts[pts.length - 1].fecha)) + "</text>";
  const rm = linea("e1rm");
  if (rm) s += '<polyline points="' + rm + '" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3"/>';
  s += '<polyline points="' + linea("top") + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach((p, i) => { s += '<circle cx="' + X(xs[i]).toFixed(1) + '" cy="' + Y(p.top).toFixed(1) + '" r="3" fill="var(--accent)"/>'; });
  s += "</svg>";
  const u = pts[pts.length - 1];
  return s + '<div class="fila mini tenue" style="gap:14px;flex-wrap:wrap"><span class="fila" style="gap:6px"><i style="width:16px;height:3px;background:var(--accent)"></i>Peso top · <b class="num" style="color:var(--ink)">' + L.kg(u.top) + ' kg</b></span><span class="fila" style="gap:6px"><i style="width:16px;height:0;border-top:2px dashed var(--muted)"></i>1RM estimado · <b class="num" style="color:var(--ink)">' + (u.e1rm ? L.kg(u.e1rm) + " kg" : "—") + "</b></span></div>";
}
function chispa(vals) {
  if (vals.length < 2) return '<svg class="graf" viewBox="0 0 140 40" aria-hidden="true"></svg>';
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), r = max - min || 1;
  const pts = vals.map((v, i) => (4 + i / (vals.length - 1) * 132).toFixed(1) + "," + (36 - (v - min) / r * 32).toFixed(1)).join(" ");
  return '<svg class="graf" viewBox="0 0 140 40" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function graficoPeso(pts) {

/** Aplicar la elección de ejercicio según de dónde se vino. */
function elegir(id) {
  const p = ui.params, e = L.ejercicioPorId(estado, id);
  if (!e) return;
  if (p.para === "rutina") {
    if (ui.rutina && !ui.rutina.ejercicios.some((x) => x.ejercicio_id === id)) ui.rutina.ejercicios.push({ ejercicio_id: id, series: e.series });
    ir("rutina", {}, true); return;
  }
  const s = L.sesionPorId(estado, p.id) || L.sesionEnCurso(estado);
  if (!s) { ir("inicio"); return; }
  if (p.para === "cambiar") {
    const b = s.ejercicios[p.i];
    if (b && !b.filas.some((f) => f.hecha)) {
      const ya = s.ejercicios.findIndex((x) => x.ejercicio_id === id);
      cambiar(() => {
        if (ya >= 0 && ya !== p.i) { s.ejercicios.splice(p.i, 1); ui.abierto[s.id] = ya > p.i ? ya - 1 : ya; }
        else s.ejercicios[p.i] = L.bloqueSesion(estado, refDe(s), id, b.series_plan);
      }, true);
    }
  } else {
    const ya = s.ejercicios.findIndex((x) => x.ejercicio_id === id);
    if (ya >= 0) ui.abierto[s.id] = ya;
    else { cambiar(() => s.ejercicios.push(L.bloqueSesion(estado, refDe(s), id, e.series)), true); ui.abierto[s.id] = s.ejercicios.length - 1; }
  }
  // Volver a la sesión sin dejar «elegir» en el historial
  ir("sesion", { id: s.id }, true);
}

      aviso("No se pudo abrir la rutina", MSJ_DANADO); return;

    toast("Rutina «" + plan.nombre + "» agregada");

   olvidó al arrancar; los datos siguen aquí. Se marca como visto al responder. */
async function avisoMigracion() {
  if (DEMO || !P.avisoMigracionPendiente()) return;
  const r = await preguntar("Cambió cómo se guarda tu respaldo",
    "Ya no se guarda automáticamente en tu archivo .json. <b>Tus datos siguen aquí.</b> Guarda respaldos con «Guardar respaldo»; tu archivo .json sirve para restaurar.",
    [{ valor: "guardar", texto: "Guardar respaldo ahora", tono: "prim" }, { valor: "ok", texto: "Entendido" }]);
  await P.marcarMigracionAvisada();
  if (r === "guardar") A.guardarRespaldo();
}
/* Repintar Ajustes trae los respaldos internos (asíncrono). */
const renderBase = render;
render = function (nuevaVista) { renderBase(nuevaVista); if (ui.vista === "ajustes") pintarRespaldos(); };
window.addEventListener("error", (ev) => { console.error(ev.error || ev.message); });
window.Rutina = { L: L, P: P, ui: ui, PWA: PWA, estado: () => estado, render: () => render(true), dibujarPantallaRecap: dibujarPantallaRecap, imagenRecap: imagenRecap };   // para inspección y pruebas
iniciarPwa();
arrancar(false);
})();
